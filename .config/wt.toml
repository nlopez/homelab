[pre-start]
pre-commit = "pre-commit install"
direnv-allow = "(cd {{ base_worktree_path }} && direnv status) 2>/dev/null | grep -q 'Found RC allowed 0' && direnv allow {{ worktree_path }}; true"

[post-merge]
# Pushes the target and posts the result to Discord (webhook in 1Password).
push = ".config/discord-push.sh {{ target }}"
