repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    files: ^kubernetes/
  - id: end-of-file-fixer
    files: ^kubernetes/
    # yamlfmt keeps a trailing blank line after the final `---` here and would undo this hook.
    exclude: ^kubernetes/apps/external-snapshotter/crds\.yaml$
  - id: check-yaml
    files: ^(kubernetes|\.github)/
    args: ["--allow-multiple-documents"]
  - id: check-added-large-files
    files: ^kubernetes/
  - id: check-json
    files: ^renovate\.json$
# The workflows, and the run: scripts in them (actionlint runs shellcheck on
# those when it's on PATH).
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    files: ^\.github/workflows/
# The scripts CI and agents run. script-tests.yaml lints the same set in CI.
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    files: ^(\.github/scripts|scripts|\.claude/hooks)/
- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt
    files: ^kubernetes/
    args: [-conf, kubernetes/.yamlfmt]
- repo: https://github.com/nlopez/check-yamlschema
  rev: v0.0.7-fix
  hooks:
  - id: check-yamlschema
    files: ^kubernetes/
- repo: local
  hooks:
  - id: kubeconform
    name: 'Validate raw Kubernetes manifests against schema (strict)'
    entry: >-
      kubeconform -strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json -ignore-missing-schemas
    language: golang
    additional_dependencies: ['github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0']
    files: ^kubernetes/apps/.*\.ya?ml$
    exclude: /values\.yaml$|/\.gitkeep$|^kubernetes/apps/pms/deployment\.yaml$
  - id: ansible-lint
    name: ansible-lint
    entry: bash -c 'cd ansible && ansible-galaxy collection install -r requirements.yaml && ansible-lint'
    language: system
    files: ^ansible/
    pass_filenames: false
  - id: tofu-fmt
    name: tofu fmt
    entry: tofu fmt -check -diff
    language: system
    files: \.(tf|tfvars)$
  - id: tofu-validate
    name: tofu validate
    entry: bash scripts/tofu-validate.sh
    language: system
    files: \.(tf|tfvars)$
    pass_filenames: true
  - id: tflint
    name: tflint
    entry: bash scripts/tflint.sh
    language: system
    files: \.(tf|tfvars)$
    pass_filenames: true
  - id: tofu-test
    name: tofu test
    entry: bash scripts/tofu-test.sh
    language: system
    files: \.(tf|tftest\.hcl)$
    pass_filenames: true
  - id: check-hostnames
    name: 'Check that app hostnames and codenames do not collide'
    entry: python scripts/check-hostnames.py
    language: python
    additional_dependencies: ['pyyaml==6.0.3']
    pass_filenames: false
    always_run: true
