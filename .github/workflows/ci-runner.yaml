name: ci-runner

# Builds ghcr.io/nlopez/ci-runner, the image of the ci-runners scale set
# (kubernetes/apps/arc-ci-runners). PRs build it; pushes to main publish it as
# <runner version>-<run number>, which Renovate then rolls out.
on:
  pull_request:
    paths: ['ci-runner/**', '.github/workflows/ci-runner.yaml']
  push:
    branches: [main]
    paths: ['ci-runner/**', '.github/workflows/ci-runner.yaml']
  workflow_dispatch:

concurrency:
  group: ci-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Read the runner version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:||p' ci-runner/Dockerfile)
          [ -n "$VERSION" ] || { echo "::error::no actions-runner FROM line in ci-runner/Dockerfile"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci-runner
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/nlopez/ci-runner:${{ steps.version.outputs.version }}-${{ github.run_number }}
            ghcr.io/nlopez/ci-runner:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      -
        name: Check the tools
        if: github.ref != 'refs/heads/main'
        env:
          IMAGE: ghcr.io/nlopez/ci-runner:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'gh --version && shellcheck --version && yq --version && jq --version && python3 -c "import yaml" && git --version'
