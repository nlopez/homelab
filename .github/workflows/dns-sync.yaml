name: dns-sync

on:
  push:
    paths: ['dns-sync/**', '.github/workflows/dns-sync.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dns-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: dns-sync
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/nlopez/dns-sync:main
            ghcr.io/nlopez/dns-sync:${{ github.sha }}
          labels: |
            org.opencontainers.image.description=Gateway API route to Unbound snapshot pusher for split-horizon DNS.
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/nlopez/dns-sync:build-cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/nlopez/dns-sync:build-cache,mode=max
