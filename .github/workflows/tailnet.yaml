name: Tailnet

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tailnet-pr-{0}', github.event.pull_request.number) || 'tailnet' }}
  cancel-in-progress: false

jobs:
  acl-test:
    name: Test ACL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache version-cache.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      # The same read-only client as the plan (tailnet/tofu/secrets.plan.env).
      - name: Load the read-only Tailscale client
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_ID: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/username
          TS_OAUTH_SECRET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/credential
          TS_TAILNET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/tailnet_id

      - name: Test ACL
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ steps.op.outputs.TS_OAUTH_ID }}
          oauth-secret: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          tailnet: ${{ steps.op.outputs.TS_TAILNET }}
          policy-file: tailnet/policy.hujson
          action: test

  tailnet:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      directory: tailnet/tofu
      title: Tailnet
      plan-role: homelab-tailnet-plan
      apply-role: homelab-tailnet-apply
      plan-env: |-
        TF_VAR_oauth_scopes=["devices:core:read", "devices:routes:read", "policy_file:read", "dns:read"]
