name: Tailnet

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/policy.hujson', '.github/workflows/tailnet.yaml']

permissions:
  contents: read
  actions: read

concurrency:
  group: tailnet
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ACL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache version-cache.json
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      - name: Test ACL
        id: test-acl
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: tailnet/policy.hujson
          action: test

  apply:
    name: Apply
    if: github.event_name == 'push'
    environment: production
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Apply
        working-directory: tailnet/tofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_TAILNET: ${{ secrets.TS_TAILNET }}
        run: |-
          tofu init -input=false
          tofu apply -input=false -auto-approve
