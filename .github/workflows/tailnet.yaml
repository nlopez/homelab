name: Tailnet

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml']

permissions:
  contents: read
  actions: read

concurrency:
  group: tailnet-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache version-cache.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      - name: Load the read-only Tailscale client
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_ID: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/username
          TS_OAUTH_SECRET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/credential
          TS_TAILNET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/tailnet_id

      - name: Test ACL
        id: test-acl
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ steps.op.outputs.TS_OAUTH_ID }}
          oauth-secret: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          tailnet: ${{ steps.op.outputs.TS_TAILNET }}
          policy-file: tailnet/policy.hujson
          action: test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-tailnet-plan
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Plan
        id: plan
        working-directory: tailnet/tofu
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ steps.op.outputs.TS_OAUTH_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          TAILSCALE_TAILNET: ${{ steps.op.outputs.TS_TAILNET }}
          TF_VAR_oauth_scopes: '["devices:core:read", "devices:routes:read", "policy_file:read", "dns:read"]'
        run: |-
          tofu init -input=false
          # The state lock needs write access, which pull requests don't get.
          tofu plan -input=false -lock=false -no-color -out=tfplan 2>&1 | tee plan.log
          tofu show -no-color tfplan > plan.txt

      - name: Comment plan
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.plan.outcome }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          cd tailnet/tofu
          if [ "$OUTCOME" = success ]; then out=plan.txt; else out=plan.log; fi
          # Other stacks comment on the same PR; the marker finds this one.
          marker="<!-- tofu-plan: Tailnet -->"
          {
            echo "$marker"
            echo "### Tailnet plan ($OUTCOME)"
            echo
            echo '```hcl'
            tail -c 60000 "$out"
            echo '```'
          } > comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  apply:
    name: Apply
    if: github.event_name == 'push'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-tailnet-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: tailnet/tofu
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve
