name: Tailnet

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/policy.hujson', '.github/workflows/tailnet.yaml']

permissions:
  contents: read
  actions: read

concurrency:
  group: tailnet
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ACL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache version-cache.json
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      - name: Load the read-only Tailscale client
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_ID: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/username
          TS_OAUTH_SECRET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/credential

      - name: Test ACL
        id: test-acl
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ steps.op.outputs.TS_OAUTH_ID }}
          oauth-secret: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          tailnet: '-'
          policy-file: tailnet/policy.hujson
          action: test

  apply:
    name: Apply
    if: github.event_name == 'push'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-tailnet-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: tailnet/tofu
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve
