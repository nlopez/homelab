name: Tailnet

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/**', '.github/workflows/tailnet.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: tailnet
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache version-cache.json
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      - name: Load the read-only Tailscale client
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_ID: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/username
          TS_OAUTH_SECRET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/credential
          TS_TAILNET: op://6foq5pqns6uslgstwbfoyyyftu/rsblijwagdjew33ufwj2f5vyte/tailnet_id

      - name: Test ACL
        id: test-acl
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ steps.op.outputs.TS_OAUTH_ID }}
          oauth-secret: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          tailnet: ${{ steps.op.outputs.TS_TAILNET }}
          policy-file: tailnet/policy.hujson
          action: test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-tailnet-plan
          aws-region: us-east-1

      - name: Plan
        uses: ./.github/actions/tofu-plan
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ steps.op.outputs.TS_OAUTH_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ steps.op.outputs.TS_OAUTH_SECRET }}
          TAILSCALE_TAILNET: ${{ steps.op.outputs.TS_TAILNET }}
          TF_VAR_oauth_scopes: '["devices:core:read", "devices:routes:read", "policy_file:read", "dns:read"]'
        with:
          working-directory: tailnet/tofu
          title: Tailnet

  apply:
    name: Apply
    if: github.event_name == 'push'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-tailnet-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Plan
        id: plan
        working-directory: tailnet/tofu
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          # 0 planned nothing, 2 planned changes, 1 is an error.
          status=0
          op run --env-file secrets.env -- tofu plan -input=false -detailed-exitcode -out=tfplan || status=$?
          case "${status}" in
            0) echo "changed=false" >>"${GITHUB_OUTPUT}" ;;
            2) echo "changed=true" >>"${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

      - name: Apply
        if: steps.plan.outputs.changed == 'true'
        working-directory: tailnet/tofu
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op run --env-file secrets.env -- tofu apply -input=false tfplan

      - uses: ./.github/actions/discord-notify
        if: success() && steps.plan.outputs.changed == 'true'
        with:
          result: applied
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - uses: ./.github/actions/discord-notify
        if: failure() || cancelled()
        with:
          result: failed
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
