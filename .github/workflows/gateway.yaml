name: Gateway

on:
  push:
    branches: [ "main" ]
    paths: ['gateway/**', '.github/workflows/gateway.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['gateway/**', '.github/workflows/gateway.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gateway-pr-{0}', github.event.pull_request.number) || 'gateway' }}
  cancel-in-progress: false

jobs:
  # The WireGuard keys are deliberately kept out of pull requests: the plan user
  # has no WireGuard page privilege, so the PR plan excludes every WireGuard
  # resource and WireGuard changes aren't planned before merge. The dns-webhook
  # passwords are ignore_changes, so placeholders plan the same as the real
  # values.
  gateway:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit
    with:
      directory: gateway
      title: Gateway
      plan-role: homelab-gateway-plan
      apply-role: homelab-gateway-apply
      tailnet: true
      hosts: |-
        192.168.222.1 gw.lga1.radoncanyon.com
        192.168.239.254 gw.lga2.radoncanyon.com
      plan-env: |-
        TF_VAR_lga1_wg_private_key=placeholder
        TF_VAR_lga2_wg_private_key=placeholder
        TF_VAR_wg_psk=placeholder
        TF_VAR_lga1_dns_webhook_password=placeholder
        TF_VAR_lga2_dns_webhook_password=placeholder
      plan-args: >-
        -exclude=opnsense_wireguard_settings.lga1
        -exclude=opnsense_wireguard_settings.lga2
        -exclude=opnsense_wireguard_server.lga1
        -exclude=opnsense_wireguard_server.lga2
        -exclude=opnsense_wireguard_peer.lga1_lga2
        -exclude=opnsense_wireguard_peer.lga2_lga1
