name: Gateway

on:
  push:
    branches: [ "main" ]
    paths: ['gateway/**', '.github/workflows/gateway.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The client id and audience come from tailscale_federated_identity
      # .github_actions in tailnet/admin; the action requests a GitHub OIDC
      # token for that audience itself.
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          audience: api.tailscale.com/TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          tags: tag:ci

      - name: Resolve the gateways
        run: |
          echo "192.168.222.1 gw.lga1.radoncanyon.com" | sudo tee -a /etc/hosts
          echo "192.168.239.254 gw.lga2.radoncanyon.com" | sudo tee -a /etc/hosts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-gateway-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: gateway
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve -no-color | tee "$RUNNER_TEMP/apply.log"

      # The provider saves DNSBL settings without rebuilding the blocklist, so a
      # changed policy has no effect until Unbound downloads the lists and reloads.
      - name: Reload Unbound DNSBL
        working-directory: gateway
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          sites=$(sed -nE 's/^opnsense_unbound_dnsbl\.(lga[0-9]+): (Creation|Modifications) complete.*/\1/p' "$RUNNER_TEMP/apply.log" | sort -u)
          if [ -z "$sites" ]; then
            echo "No DNSBL changes"
            exit 0
          fi
          grep -E '^TF_VAR_lga[0-9]+_api_(key|secret)=' secrets.env > "$RUNNER_TEMP/api.env"
          for site in $sites; do
            # shellcheck disable=SC2016 # expanded by the inner shell after op run injects secrets
            SITE=$site op run --env-file "$RUNNER_TEMP/api.env" -- sh -ec '
              eval "key=\$TF_VAR_${SITE}_api_key secret=\$TF_VAR_${SITE}_api_secret"
              for action in dnsbl reconfigure; do
                curl -fsS -X POST -H "Content-Type: application/json" -d "{}" -u "$key:$secret" \
                  "https://gw.$SITE.radoncanyon.com/api/unbound/service/$action"
                echo " <- $SITE $action"
              done
            '
          done
