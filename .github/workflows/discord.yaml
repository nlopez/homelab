name: Discord

# Posts to Discord only when a workflow's Apply job actually ran.
on:
  workflow_run:
    workflows:
      - Authentik
      - AWS
      - Datadog
      - DNS
      - Gateway
      - State bucket
      - Tailnet
      - Tailnet admin
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Notify
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Post apply result
        env:
          GH_TOKEN: ${{ github.token }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # Conclusions of Apply jobs that ran (matrix jobs are named "Apply <dir>").
          conclusions="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name | startswith("Apply")) | select(.conclusion != "skipped") | .conclusion')"
          if [[ -z "${conclusions}" ]]; then
            echo "No Apply job ran; nothing to post."
            exit 0
          fi
          if grep -qvx success <<<"${conclusions}"; then
            icon="❌"; color=15158332; result="failed"
          else
            # Every apply job plans first, so a stack with nothing to do prints
            # "No changes." and never reaches tofu apply. That line and an
            # all-zero apply summary are the only results worth staying quiet
            # about. An unreadable log yields neither, so it counts as a change.
            results="$(gh run view "${RUN_ID}" --repo "${REPO}" --log 2>/dev/null |
              grep -aoE 'No changes\.|Apply complete! Resources: [0-9]+ added, [0-9]+ changed, [0-9]+ destroyed\.' || true)"
            if ! grep -qvx -e 'No changes\.' -e 'Apply complete! Resources: 0 added, 0 changed, 0 destroyed\.' <<<"${results}"; then
              echo "Every Apply job reported no changes; nothing to post."
              exit 0
            fi
            icon="✅"; color=3066993; result="applied"
          fi
          jq -n \
            --arg title "${icon} ${WORKFLOW} ${result}" \
            --arg url "${RUN_URL}" \
            --arg body "\`${SHA:0:8}\` ${MESSAGE%%$'\n'*}" \
            --arg footer "${BRANCH}" \
            --argjson color "${color}" \
            '{username: "homelab actions", embeds: [{title: $title, url: $url, description: $body, color: $color, footer: {text: $footer}}]}' |
            curl -fsS -H 'Content-Type: application/json' --data @- \
              "$(op read op://kjgjpiwjlognsprl7qxsonrqoi/6hgf3n5cgyskb7xtic6qkrdm74/credential)"
