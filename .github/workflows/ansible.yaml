name: Ansible

on:
  # A merge applies on its own only when it changes nothing but roles in
  # .github/scripts/ansible-merge-tags.py's allowlist, and then only those
  # roles' tags. Any other change waits for a dispatch with apply.
  push:
    branches: [ "main" ]
    paths: ['ansible/**', '.github/workflows/ansible.yaml', '.github/scripts/ansible-merge-tags.py']
  schedule:
    # Nightly drift check. Applying is always an explicit decision.
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the playbooks instead of only reporting drift
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ansible
  cancel-in-progress: false

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  ansible:
    name: ${{ github.event_name == 'push' && 'Apply on merge' || inputs.apply && 'Apply' || 'Drift check' }}
    environment: production
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push's before commit, to see what a merge changed.
          fetch-depth: 0

      # check: the nightly or a dispatched drift check. apply: a dispatch with
      # apply, every role. merge: a push whose changes are all allowlisted
      # roles, only their tags. skip: any other push.
      - name: Decide what to run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          APPLY: ${{ inputs.apply }}
          BEFORE: ${{ github.event.before }}
        run: |
          tags=""
          if [ "${EVENT}" = push ]; then
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = 0000000000000000000000000000000000000000 ]; then BEFORE="${GITHUB_SHA}^"; fi
            tags="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | .github/scripts/ansible-merge-tags.py)"
            if [ -n "${tags}" ]; then mode=merge; else mode=skip; fi
          elif [ "${APPLY}" = true ]; then mode=apply
          else mode=check
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          if [ "${mode}" = skip ]; then
            {
              echo "## Ansible: not applied"
              echo
              echo "This push changes Ansible files outside the roles a merge may apply on its own"
              echo "(\`.github/scripts/ansible-merge-tags.py\`), or none at all. To apply it, run the"
              echo "Ansible workflow with **apply** checked."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::notice title=Ansible not applied::This change needs a dispatch of the Ansible workflow with apply."
          fi

      # The client id and audience come from tailscale_federated_identity
      # .github_actions in tailnet/admin; the action requests a GitHub OIDC
      # token for that audience itself. The runner authenticates to the hosts
      # through Tailscale SSH, so no SSH key is stored anywhere.
      - name: Join the tailnet
        if: steps.mode.outputs.mode != 'skip'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          audience: api.tailscale.com/TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          tags: tag:ci

      # The inventory is keyed by the sites' names, which only resolve through
      # the tailnet's split DNS. Point them at the nodes' tailnet addresses.
      - name: Map the inventory names to tailnet addresses
        if: steps.mode.outputs.mode != 'skip'
        run: |
          while read -r fqdn peer; do
            ip=$(tailscale ip -4 "$peer")
            echo "$ip $fqdn" | sudo tee -a /etc/hosts
          done <<'EOF'
          knode1.lga1.radoncanyon.com knode1
          knode2.lga1.radoncanyon.com knode2
          odroid.lga1.radoncanyon.com odroid-lga1
          odroid.lga2.radoncanyon.com odroid-lga2
          EOF

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        if: steps.mode.outputs.mode != 'skip'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install 1Password CLI
        if: steps.mode.outputs.mode != 'skip'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Check for drift
        id: drift
        if: steps.mode.outputs.mode == 'check'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set +e
          op run --env-file ansible/secrets.env -- nix develop -c \
            bash -c 'cd ansible && ansible-galaxy collection install -r requirements.yaml && ansible-playbook site.yaml --check --diff' 2>&1 | tee check.log
          rc=${PIPESTATUS[0]}
          drift=$(grep -cE 'changed=[1-9][0-9]*' check.log)
          {
            echo "## Ansible drift check"
            echo
            echo "playbook exit code: $rc, hosts reporting changes: $drift"
            echo
            echo '```'
            tail -c 60000 check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "drift=${drift}" >> "$GITHUB_OUTPUT"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$drift" -gt 0 ]; then
            echo "::warning::the hosts do not match the playbooks; see the Drift in Ansible issue"
          fi
          exit "$rc"

      # Keeps one open "Drift in Ansible" issue while the hosts differ from the
      # playbooks, as the OpenTofu stacks do (_tofu-stack.yaml). The issue gets
      # only the play recap and the names of the changed tasks: --diff output
      # can hold rendered templates with secrets, so it stays in the run log.
      - name: Report drift
        if: ${{ steps.mode.outputs.mode == 'check' && steps.drift.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Drift in Ansible
          DRIFT: ${{ steps.drift.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ "${DRIFT}" -gt 0 ]; then
            {
              echo "The nightly check-mode run of \`${GITHUB_SHA:0:8}\` on \`main\` found hosts that differ from the playbooks ([run](${RUN_URL}); the full diff is in its log)."
              echo
              .github/scripts/ansible-drift-summary.sh check.log
            } > drift.md
            if [ -n "${issue}" ]; then
              gh issue comment "${issue}" --body-file drift.md
            else
              gh issue create --title "${TITLE}" --body-file drift.md
            fi
          elif [ -n "${issue}" ]; then
            gh issue close "${issue}" --comment "The nightly check-mode run of \`${GITHUB_SHA:0:8}\` found no drift ([run](${RUN_URL}))."
          fi

      - name: Apply
        if: steps.mode.outputs.mode == 'apply'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          op run --env-file ansible/secrets.env -- nix develop -c \
            bash -c 'cd ansible && ansible-galaxy collection install -r requirements.yaml && ansible-playbook site.yaml'

      - name: Apply the merged roles
        if: steps.mode.outputs.mode == 'merge'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TAGS: ${{ steps.mode.outputs.tags }}
        run: |
          echo "Applying only: ${TAGS}"
          # shellcheck disable=SC2016 # the inner bash expands TAGS from the environment
          op run --env-file ansible/secrets.env -- nix develop -c \
            bash -c 'cd ansible && ansible-galaxy collection install -r requirements.yaml && ansible-playbook site.yaml --tags "${TAGS}"'
