name: State bucket

on:
  push:
    branches: [ "main" ]
    paths: ['aws/state-bucket/**', '.github/workflows/state-bucket.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['aws/state-bucket/**', '.github/workflows/state-bucket.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '31 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('state-bucket-pr-{0}', github.event.pull_request.number) || 'state-bucket' }}
  cancel-in-progress: false

jobs:
  # The apply role can change its own trust policy and the OIDC provider. If an
  # apply locks it out, apply locally with the AdministratorAccess permission set.
  state-bucket:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      directory: aws/state-bucket
      title: State bucket
      plan-role: homelab-state-bucket-plan
      apply-role: homelab-state-bucket-apply
