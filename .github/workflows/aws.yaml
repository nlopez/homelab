name: AWS

on:
  push:
    branches: [ "main" ]
    paths: ['aws/**', '.github/workflows/aws.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['aws/**', '.github/workflows/aws.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
    inputs:
      drift-only:
        description: Only plan and report drift, as the nightly run does; don't apply
        type: boolean
        default: false
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '35 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('aws-pr-{0}', github.event.pull_request.number) || 'aws' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  aws:
    uses: ./.github/workflows/_tofu-stack.yaml
    strategy:
      fail-fast: false
      matrix:
        dir: [ses, authentik-smtp, forgejo-smtp, seafile-smtp, nas-smtp, immich-smtp]
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      drift-only: ${{ inputs.drift-only == true }}
      directory: aws/${{ matrix.dir }}
      title: AWS ${{ matrix.dir }}
      plan-role: homelab-aws-plan
      apply-role: homelab-aws-apply
      notify-subject: AWS ${{ matrix.dir }}
