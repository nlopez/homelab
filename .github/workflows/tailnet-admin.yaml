name: Tailnet admin

on:
  push:
    branches: [ "main" ]
    paths: ['tailnet/admin/**', '.github/workflows/tailnet-admin.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['tailnet/admin/**', '.github/workflows/tailnet-admin.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
    inputs:
      drift-only:
        description: Only plan and report drift, as the nightly run does; don't apply
        type: boolean
        default: false
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '27 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tailnet-admin-pr-{0}', github.event.pull_request.number) || 'tailnet-admin' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  tailnet-admin:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      drift-only: ${{ inputs.drift-only == true }}
      directory: tailnet/admin
      title: Tailnet admin
      plan-role: homelab-tailnet-admin-plan
      apply-role: homelab-tailnet-admin-apply
