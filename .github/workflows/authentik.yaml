name: Authentik

on:
  push:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
    inputs:
      drift-only:
        description: Only plan and report drift, as the nightly run does; don't apply
        type: boolean
        default: false
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '15 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('authentik-pr-{0}', github.event.pull_request.number) || 'authentik' }}
  cancel-in-progress: false

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  # The authentik API is reached through its public route, so the runner stays
  # off the tailnet. Joining it would send desertbluffs.com lookups to the
  # gateway resolvers through split DNS, which tag:ci cannot reach.
  #
  # The read-only token can't see OAuth2 client secrets, so a refresh would show
  # every provider's secret changing. The PR plan compares against state
  # instead; applies refresh.
  authentik:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      drift-only: ${{ inputs.drift-only == true }}
      directory: authentik
      title: Authentik
      plan-role: homelab-authentik-plan
      apply-role: homelab-authentik-apply
      plan-args: -refresh=false
