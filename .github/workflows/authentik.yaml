name: Authentik

on:
  push:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authentik
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The client id and audience come from tailscale_federated_identity
      # .github_actions in tailnet/admin; the action requests a GitHub OIDC
      # token for that audience itself.
      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v4.4.0
        with:
          oauth-client-id: TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          audience: api.tailscale.com/TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL
          tags: tag:ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-authentik-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: authentik
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve
