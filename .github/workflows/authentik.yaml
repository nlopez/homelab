name: Authentik

on:
  push:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authentik-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/tofu-plan.yaml
    with:
      name: Authentik
      working-directory: authentik
      role: homelab-authentik-plan
      env-file: secrets.pr.env
    secrets: inherit

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The authentik API is reached through its public route, so the runner
      # stays off the tailnet. Joining it would send desertbluffs.com lookups
      # to the gateway resolvers through split DNS, which tag:ci cannot reach.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-authentik-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: authentik
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve
