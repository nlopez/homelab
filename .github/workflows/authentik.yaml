name: Authentik

on:
  push:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml']
  pull_request:
    branches: [ "main" ]
    paths: ['authentik/**', '.github/workflows/authentik.yaml', '.github/actions/tofu-plan/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('authentik-pr-{0}', github.event.pull_request.number) || 'authentik' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load read-only credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
          AUTHENTIK_TOKEN: op://6foq5pqns6uslgstwbfoyyyftu/f7ceoathkg6nmchaqt2im5ntay/credential
          TF_VAR_forgejo_client_id: op://6foq5pqns6uslgstwbfoyyyftu/yv4huth7yssh5vv63xirvc3ea4/key
          TF_VAR_forgejo_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/yv4huth7yssh5vv63xirvc3ea4/secret
          TF_VAR_sonarr_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/2u237ntcj3khoisldz6dtynk7i/client-secret
          TF_VAR_radarr_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/kggaaie4jga24cm4oi2wcjivru/client-secret
          TF_VAR_homepage_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/2sbqooatayruvtvb2vvdfbwr4u/client-secret
          TF_VAR_pixivfe_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/czockr5sqqjzdgzlmy7nwnip6y/client-secret
          TF_VAR_shaarli_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/7sjfe5z7j5fk33at5t3eymvbpm/client-secret
          TF_VAR_karakeep_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/ih3qcxa6ihzyypajyx7llhyb4u/client-secret
          TF_VAR_seafile_client_secret: op://6foq5pqns6uslgstwbfoyyyftu/nmqdkmk7mmxzyocfobmvoedwfm/client-secret

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-authentik-plan
          aws-region: us-east-1

      - name: Plan
        uses: ./.github/actions/tofu-plan
        with:
          working-directory: authentik
          title: Authentik

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The authentik API is reached through its public route, so the runner
      # stays off the tailnet. Joining it would send desertbluffs.com lookups
      # to the gateway resolvers through split DNS, which tag:ci cannot reach.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-authentik-apply
          aws-region: us-east-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Apply
        working-directory: authentik
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          tofu init -input=false
          op run --env-file secrets.env -- tofu apply -input=false -auto-approve
