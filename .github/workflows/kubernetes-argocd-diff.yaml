name: 'Kubernetes Manifest Diff'
on:
  pull_request:
    paths:
    - 'kubernetes/apps/**'
    - 'kubernetes/bootstrap/**'
    - '.github/workflows/kubernetes-argocd-diff.yaml'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: kubernetes-manifest-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  diff:
    name: 'Manifest Diff'
    runs-on: home-runners
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - name: 'Checkout base branch'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base-branch
    - name: 'Checkout PR branch'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: target-branch
        fetch-depth: 0
    - name: 'Install kubectl, argocd-diff-preview, and yq'
      # shortcut: pinned by hand, bump with the cluster / a new release.
      run: |-
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
        echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  $RUNNER_TEMP/bin/yq" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/bin/yq"
        curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl
        echo "ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
        curl -fsSL -o "$RUNNER_TEMP/diff.tgz" https://github.com/dag-andersen/argocd-diff-preview/releases/download/v0.2.17/argocd-diff-preview-Linux-x86_64.tar.gz
        echo "3913c5ded0c4bb748ab8cabc47d9ea1060462fb797b4b61e1a12a805fc35a319  $RUNNER_TEMP/diff.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/diff.tgz" -C "$RUNNER_TEMP/bin"
        chmod +x "$RUNNER_TEMP/bin/kubectl"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: 'Render manifests and diff'
      run: |-
        argocd-diff-preview \
          --repo "$GITHUB_REPOSITORY" \
          --base-branch '${{ github.event.pull_request.base.sha }}' \
          --target-branch '${{ github.sha }}' \
          --argocd-namespace argocd-diff-preview \
          --create-cluster=false \
          --file-regex '(^|/)kubernetes/(bootstrap|apps)/' \
          --output-app-manifests \
          --diff-ignore '^  install_(id|time): '
    # ci-ok reads the plan-destroys annotation and fails until a code owner
    # adds the destroy-approved label (.github/workflows/ci-gate-protected.yaml).
    - name: 'Check for deletions'
      run: |-
        target-branch/.github/scripts/manifest-destroys.sh output > destroys.txt
        if [ -s destroys.txt ]; then
          cat destroys.txt
          echo "::warning title=plan-destroys::Kubernetes: $(paste -sd ',' destroys.txt)"
        fi
    - name: 'Add diff to job summary'
      if: always()
      run: |-
        if [ -f output/diff.md ]; then
          cat output/diff.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: 'Comment on PR'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |-
          const body = '<!-- manifest-diff -->\n' + require('fs').readFileSync('output/diff.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const prev = comments.filter(c => c.body.startsWith('<!-- manifest-diff -->')).pop();
          if (prev) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
