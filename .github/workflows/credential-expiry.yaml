name: Credential expiry

# Weekly: keeps one open "Credentials expiring" issue while a credential in
# .github/credentials.yaml is within 30 days of its expiry or past it, and
# closes it once none is. Needs no credentials of its own.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: ['.github/credentials.yaml', '.github/workflows/credential-expiry.yaml', '.github/scripts/credential-expiry.py']

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: false

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and keep the issue current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Credentials expiring"
          rc=0
          list="$(.github/scripts/credential-expiry.py)" || rc=$?
          if [ "${rc}" -gt 1 ]; then exit "${rc}"; fi
          echo "${list}" | tee -a "${GITHUB_STEP_SUMMARY}"
          issue="$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ "${rc}" -eq 1 ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown
            body="$(printf 'These credentials in `.github/credentials.yaml` expire within 30 days or have expired ([run](%s)). Rotate each, then update its `expires`.\n\n%s\n' "${RUN_URL}" "${list}")"
            if [ -n "${issue}" ]; then
              gh issue edit "${issue}" --body "${body}"
            else
              gh issue create --title "${title}" --body "${body}"
            fi
          elif [ -n "${issue}" ]; then
            gh issue close "${issue}" --comment "No credential expires within 30 days any more ([run](${RUN_URL}))."
          fi
