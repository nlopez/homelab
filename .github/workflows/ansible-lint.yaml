name: ansible-lint
on:
  push:
    branches: [main]
    paths: ['ansible/**', 'devenv.nix', 'devenv.lock', 'devenv.yaml', '.github/workflows/ansible-lint.yaml']
  pull_request:
    paths: ['ansible/**', 'devenv.nix', 'devenv.lock', 'devenv.yaml', '.github/workflows/ansible-lint.yaml']

permissions:
  contents: read

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Run ansible-lint
        run: devenv shell -- bash -c 'ansible-galaxy collection install -r requirements.yaml && ansible-lint'
