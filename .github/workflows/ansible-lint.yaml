name: ansible-lint
on:
  push:
    branches: [main]
    paths: ['ansible/**', 'flake.nix', 'flake.lock', '.github/workflows/ansible-lint.yaml']
  pull_request:
    paths: ['ansible/**', 'flake.nix', 'flake.lock', '.github/workflows/ansible-lint.yaml']

permissions:
  contents: read

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ansible-lint
        run: nix develop "${GITHUB_WORKSPACE}" -c bash -c 'ansible-galaxy collection install -r requirements.yaml && ansible-lint'
