name: Gateway backup

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up config.xml
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Resolve and reach the gateways
        run: |
          # Split DNS on the tailnet answers for radoncanyon.com, but the
          # userspace resolver inside the Tailscale action does not forward
          # those queries. The site addresses route over the subnet routers.
          echo "192.168.222.1 gw.lga1.radoncanyon.com" | sudo tee -a /etc/hosts
          echo "192.168.239.254 gw.lga2.radoncanyon.com" | sudo tee -a /etc/hosts
          for h in gw.lga1.radoncanyon.com gw.lga2.radoncanyon.com; do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "https://$h/api/core/firmware/status" || true)
            if [ "$code" = 000 ]; then
              echo "$h is unreachable from the runner" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-gateway-apply
          aws-region: us-east-1

      - name: Back up
        env:
          OPNSENSE_LGA1_API_KEY: ${{ secrets.OPNSENSE_LGA1_API_KEY }}
          OPNSENSE_LGA1_API_CREDENTIAL: ${{ secrets.OPNSENSE_LGA1_API_CREDENTIAL }}
          OPNSENSE_LGA2_API_KEY: ${{ secrets.OPNSENSE_LGA2_API_KEY }}
          OPNSENSE_LGA2_API_CREDENTIAL: ${{ secrets.OPNSENSE_LGA2_API_CREDENTIAL }}
        run: ./gateway/scripts/backup-config.sh
