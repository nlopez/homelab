name: Gateway backup

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up config.xml
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::546422192262:role/homelab-gateway-apply
          aws-region: us-east-1

      - name: Back up
        env:
          OPNSENSE_LGA1_API_KEY: ${{ secrets.OPNSENSE_LGA1_API_KEY }}
          OPNSENSE_LGA1_API_CREDENTIAL: ${{ secrets.OPNSENSE_LGA1_API_CREDENTIAL }}
          OPNSENSE_LGA2_API_KEY: ${{ secrets.OPNSENSE_LGA2_API_KEY }}
          OPNSENSE_LGA2_API_CREDENTIAL: ${{ secrets.OPNSENSE_LGA2_API_CREDENTIAL }}
        run: ./gateway/scripts/backup-config.sh
