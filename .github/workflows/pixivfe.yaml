name: pixivfe

on:
  push:
    paths: ['pixivfe/**', '.github/workflows/pixivfe.yaml']
  workflow_dispatch:

concurrency:
  group: pixivfe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Read the upstream version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ARG PIXIVFE_VERSION=//p' pixivfe/Dockerfile)
          [ -n "$VERSION" ] || { echo "::error::no ARG PIXIVFE_VERSION in pixivfe/Dockerfile"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pixivfe
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/nlopez/pixivfe:${{ steps.version.outputs.version }}-${{ github.run_number }}
            ghcr.io/nlopez/pixivfe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
