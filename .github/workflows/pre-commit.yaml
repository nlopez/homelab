name: pre-commit

# Runs the same hooks as a local commit, from the same dev shell, on the files
# a pull request changes. Agents without the dev shell rely on this check.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Run the hooks on the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |-
          devenv shell -- pre-commit run --show-diff-on-failure --color always \
            --from-ref "${BASE}" --to-ref "${HEAD}"
