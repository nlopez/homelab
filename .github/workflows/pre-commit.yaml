name: pre-commit

# Runs the same hooks as a local commit, from the same dev shell, on the files
# a pull request changes. Agents without the dev shell rely on this check.
#
# Installing the hook environments is most of the job (actionlint and
# kubeconform build with Go), so they're cached by .pre-commit-config.yaml and
# flake.lock (the dev shell's Python). Pull requests only restore the cache;
# main saves it, on a change to either file and weekly, so a PR can't poison
# what other runs use and the cache doesn't expire unused.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths: ['.pre-commit-config.yaml', 'flake.nix', 'flake.lock', '.github/workflows/pre-commit.yaml']
  schedule:
    - cron: '41 13 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the hook environments
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      - name: Run the hooks on the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          nix develop -c pre-commit run --show-diff-on-failure --color always \
            --from-ref "${BASE}" --to-ref "${HEAD}"

  warm:
    name: Save the hook environments
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the hook environments
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      # A hit keeps the entry alive; a miss builds and saves it.
      - name: Install the hook environments
        if: steps.restore.outputs.cache-hit != 'true'
        run: nix develop -c pre-commit install-hooks

      - name: Save the hook environments
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}
