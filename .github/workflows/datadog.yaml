name: Datadog

on:
  push:
    branches: [ "main" ]
    paths: ['datadog/**', '.github/workflows/datadog.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['datadog/**', '.github/workflows/datadog.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '11 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('datadog-pr-{0}', github.event.pull_request.number) || 'datadog' }}
  cancel-in-progress: false

jobs:
  datadog:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      directory: datadog
      title: Datadog
      plan-role: homelab-datadog-plan
      apply-role: homelab-datadog-apply
