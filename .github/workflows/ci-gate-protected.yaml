name: CI gate (protected)

# The tamper-proof ci-ok. A pull_request workflow runs the PR's own copy, so a
# PR could weaken the gate that judges it, and any workflow can post a passing
# "ci-ok" as GitHub Actions. This one runs on pull_request_target, so it always
# runs main's workflow and main's scripts and never checks out the PR's code,
# and it posts ci-ok as the ci-gate GitHub App (github/ci-gate.tf). The app's
# key is in the ci-gate environment, which only jobs running against main can
# read, and the main ruleset requires the app's ci-ok.
on:
  pull_request_target:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: ci-gate-protected-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Protected gate
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    environment: ci-gate
    permissions:
      contents: read

    steps:
      # main's scripts: pull_request_target checks out the base branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Get the app's token
        env:
          APP_ID: ${{ vars.CI_GATE_APP_ID }}
          APP_KEY: ${{ secrets.CI_GATE_APP_KEY }}
          REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "${key}"' EXIT
          printf '%s\n' "${APP_KEY}" > "${key}"
          token="$(.github/scripts/app-token.sh token "${APP_ID}" "${key}" "${REPO}")"
          echo "::add-mask::${token}"
          echo "APP_TOKEN=${token}" >> "${GITHUB_ENV}"

      # Starts ci-ok, runs the gate, posts the summary comment, and completes
      # ci-ok with the result; it exits with the gate's status. Tested end to
      # end in .github/scripts/tests/run.sh.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ env.APP_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/ci-gate-run.sh

      # Fails closed: if the job was cancelled, or the script stopped before
      # completing ci-ok, complete it here as cancelled or failed. A run whose
      # gate failed already completed it as failed; this only repeats that.
      - name: Complete ci-ok if the gate didn't
        if: ${{ always() && env.CHECK_RUN_ID != '' && steps.gate.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ env.APP_TOKEN }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}
        run: gh api -X PATCH "repos/${REPO}/check-runs/${CHECK_RUN_ID}" -f status=completed -f conclusion="${CONCLUSION}" >/dev/null
