name: TrueNAS

on:
  push:
    branches: [ "main" ]
    paths: ['truenas/**', '.github/workflows/truenas.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  pull_request:
    branches: [ "main" ]
    paths: ['truenas/**', '.github/workflows/truenas.yaml', '.github/workflows/_tofu-stack.yaml', '.github/actions/tofu-plan/**', '.github/actions/discord-notify/**']
  workflow_dispatch:
    inputs:
      drift-only:
        description: Only plan and report drift, as the nightly run does; don't apply
        type: boolean
        default: false
  schedule:
    # Nightly drift check; see _tofu-stack.yaml.
    - cron: '43 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('truenas-pr-{0}', github.event.pull_request.number) || 'truenas' }}
  cancel-in-progress: false

jobs:
  # The pull-request plan uses the ci-pr user's keys (secrets.plan.env), which
  # hold only READONLY_ADMIN. That role sees keychain attributes redacted, so
  # the plan excludes the replication SSH keypair and connection. The ACME
  # token is the one secret with no read-only copy, so it's a placeholder.
  truenas:
    uses: ./.github/workflows/_tofu-stack.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      drift-only: ${{ inputs.drift-only == true }}
      directory: truenas
      title: TrueNAS
      plan-role: homelab-truenas-plan
      apply-role: homelab-truenas-apply
      tailnet: true
      plan-env: |-
        TF_VAR_acme_cloudflare_token=placeholder
      plan-args: >-
        -exclude=truenas_keychain_ssh_connection.repl_nas1_at_nas2_nas1
        -exclude=truenas_keychain_ssh_keypair.nas1_to_nas2_replication_nas1
