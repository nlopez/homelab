name: OpenTofu stack

# Plans one OpenTofu stack on a pull request and posts the plan as a comment,
# or plans and applies it on main. On a schedule, or a manual run with
# drift-only, it only plans, with the apply
# credentials, and keeps one open "Drift: <title>" issue while the stack has
# drifted from main. Each stack's workflow calls this with its
# directory and roles; see dns.yaml for the smallest caller.
#
# Credentials:
# - AWS: OIDC roles <plan-role> and <apply-role> (aws/state-bucket/iam.tf).
#   The token's subject is the caller's (pull_request, or
#   environment:production), so calling through this workflow changes nothing
#   in the trust policies.
# - 1Password: <directory>/secrets.plan.env holds the read-only references a
#   pull-request plan uses (read with OP_CI_PR_SERVICE_ACCOUNT_TOKEN), and
#   <directory>/secrets.env the ones an apply uses (OP_SERVICE_ACCOUNT_TOKEN).
#   Either file may be absent.
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the stack
        type: string
        required: true
      title:
        description: Heading of the plan comment; also identifies it across pushes
        type: string
        required: true
      plan-role:
        description: IAM role a pull-request plan assumes
        type: string
        required: true
      apply-role:
        description: IAM role the apply on main assumes
        type: string
        required: true
      tailnet:
        description: Join the tailnet first, for stacks whose API is only on the LAN
        type: boolean
        default: false
      plan-args:
        description: Extra arguments for tofu plan on a pull request
        type: string
        default: ""
      plan-env:
        description: Non-secret NAME=value lines set for a pull-request plan
        type: string
        default: ""
      plan-oidc-env:
        description: >-
          NAME=audience lines; a pull-request plan sets each NAME to a GitHub
          OIDC token for that audience (arr/README.md)
        type: string
        default: ""
      notify-subject:
        description: Subject of the Discord message; defaults to the workflow name
        type: string
        default: ""
      drift-only:
        description: Plan on main and report drift as the nightly run does, without applying
        type: boolean
        default: false

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.2
  AWS_ACCOUNT_ID: "546422192262"
  # tailscale_federated_identity.github_actions in tailnet/admin. The PR
  # identity, .github_actions_pull_request, is the TAILSCALE_PR_CLIENT_ID
  # repository variable.
  TAILSCALE_APPLY_CLIENT_ID: TX3ajrU7JY71CNTRL-kQaJB6AVyQ11CNTRL

# shell: bash runs steps with -eo pipefail; the default (bash -e) lets a
# failing command before a pipe pass, as `script 2>&1 | tee log` once let the
# ci-ok gate pass with failed checks.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      # Labels: destroy-approved (see .github/actions/tofu-plan).
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        if: inputs.tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_PR_CLIENT_ID }}
          audience: api.tailscale.com/${{ vars.TAILSCALE_PR_CLIENT_ID }}
          tags: tag:ci

      - name: Install 1Password CLI
        if: hashFiles(format('{0}/secrets.plan.env', inputs.directory)) != ''
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      # Resolves secrets.plan.env with the read-only service account, masks
      # each value, and exports it to the later steps. Each reference goes
      # through its own `op read`: resolving the whole file with `op run`
      # intermittently failed to find the gateway-plan item ("deleted or
      # archived"), which the earlier per-variable loading never did.
      - name: Load read-only credentials
        if: hashFiles(format('{0}/secrets.plan.env', inputs.directory)) != ''
        working-directory: ${{ inputs.directory }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_PR_SERVICE_ACCOUNT_TOKEN }}
        run: '"${GITHUB_WORKSPACE}/.github/scripts/load-plan-credentials.sh" secrets.plan.env'

      - name: Set plan variables
        if: inputs.plan-env != ''
        env:
          PLAN_ENV: ${{ inputs.plan-env }}
        run: printf '%s\n' "${PLAN_ENV}" >>"${GITHUB_ENV}"

      - name: Set OIDC token plan variables
        if: inputs.plan-oidc-env != ''
        env:
          PLAN_OIDC_ENV: ${{ inputs.plan-oidc-env }}
        run: .github/scripts/oidc-plan-env.sh <<<"${PLAN_OIDC_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ inputs.plan-role }}
          aws-region: us-east-1

      - name: Plan
        uses: ./.github/actions/tofu-plan
        with:
          working-directory: ${{ inputs.directory }}
          title: ${{ inputs.title }}
          plan-args: ${{ inputs.plan-args }}
          tofu-version: ${{ env.TOFU_VERSION }}

  apply:
    # A fixed name: GitHub shows a skipped job's expression unevaluated.
    name: Apply
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action requests a GitHub OIDC token for this audience itself.
      - name: Join the tailnet
        if: inputs.tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TAILSCALE_APPLY_CLIENT_ID }}
          audience: api.tailscale.com/${{ env.TAILSCALE_APPLY_CLIENT_ID }}
          tags: tag:ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ inputs.apply-role }}
          aws-region: us-east-1

      # The wrapper turns `plan -detailed-exitcode`'s exit code 2 (changes) into
      # 0, so the Plan step below recorded changed=false for every plan and the
      # apply and the drift report never ran.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Install 1Password CLI
        if: hashFiles(format('{0}/secrets.env', inputs.directory)) != ''
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Plan
        id: plan
        working-directory: ${{ inputs.directory }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TITLE: ${{ inputs.title }}
        run: |-
          run() { if [ -f secrets.env ]; then op run --env-file secrets.env -- "$@"; else "$@"; fi; }
          tofu init -input=false
          # 0 planned nothing, 2 planned changes, 1 is an error.
          status=0
          run tofu plan -input=false -detailed-exitcode -out=tfplan || status=$?
          case "${status}" in
            0) echo "changed=false" >>"${GITHUB_OUTPUT}" ;;
            2) echo "changed=true" >>"${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac
          {
            echo "### ${TITLE} plan"
            echo
            tofu show -no-color tfplan | "${GITHUB_WORKSPACE}/.github/scripts/plan-diff.sh"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Apply
        if: steps.plan.outputs.changed == 'true' && github.event_name != 'schedule' && !inputs.drift-only
        working-directory: ${{ inputs.directory }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |-
          if [ -f secrets.env ]; then
            op run --env-file secrets.env -- tofu apply -input=false tfplan
          else
            tofu apply -input=false tfplan
          fi

      - name: Report drift
        if: github.event_name == 'schedule' || inputs.drift-only
        working-directory: ${{ inputs.directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Drift in ${{ inputs.title }}
          CHANGED: ${{ steps.plan.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          set -euo pipefail
          issue="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ "${CHANGED}" = true ]; then
            {
              echo "The nightly plan of \`${GITHUB_SHA:0:8}\` on \`main\` found changes ([run](${RUN_URL})). Something changed outside this repo, or a merge was never applied."
              echo
              echo '```hcl'
              tofu show -no-color tfplan | tail -c 60000
              echo '```'
            } > drift.md
            if [ -n "${issue}" ]; then
              gh issue comment "${issue}" --body-file drift.md
            else
              gh issue create --title "${TITLE}" --body-file drift.md
            fi
            echo "::warning::${TITLE}: the plan has changes; see the issue."
          elif [ -n "${issue}" ]; then
            gh issue close "${issue}" --comment "The nightly plan of \`${GITHUB_SHA:0:8}\` has no changes ([run](${RUN_URL}))."
          fi

      - uses: ./.github/actions/discord-notify
        if: success() && steps.plan.outputs.changed == 'true' && github.event_name != 'schedule' && !inputs.drift-only
        with:
          result: applied
          subject: ${{ inputs.notify-subject }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - uses: ./.github/actions/discord-notify
        if: failure() || cancelled()
        with:
          result: failed
          subject: ${{ inputs.notify-subject }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
