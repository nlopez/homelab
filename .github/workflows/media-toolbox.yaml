name: media-toolbox

on:
  push:
    paths: ['media-toolbox/**', '.github/workflows/media-toolbox.yaml']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      yt_dlp_version:
        description: 'yt-dlp release tag to build (e.g. 2026.08.19). Blank = use the version pinned in the Makefile.'
        required: false
        default: ''
      bgutil_version:
        description: 'bgutil-ytdlp-pot-provider release tag to build (e.g. 2.0.2). Blank = use the version pinned in the Makefile.'
        required: false
        default: ''

concurrency:
  group: media-toolbox-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      yt_dlp: ${{ steps.resolve.outputs.yt_dlp }}
      bgutil: ${{ steps.resolve.outputs.bgutil }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Resolve versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          MANUAL_YT_DLP: ${{ github.event.inputs.yt_dlp_version }}
          MANUAL_BGUTIL: ${{ github.event.inputs.bgutil_version }}
        run: |
          set -euo pipefail
          PINNED_YT_DLP=$(sed -n 's/^YT_DLP_VERSION *:= *//p' media-toolbox/Makefile)
          PINNED_BGUTIL=$(sed -n 's/^BGUTIL_YTDLP_POT_PROVIDER_VERSION *:= *//p' media-toolbox/Makefile)

          latest() {
            local tag
            tag=$(gh api "repos/$1/releases/latest" --jq .tag_name)
            [ -n "$tag" ] || { echo "::error::could not resolve latest $1 release"; exit 1; }
            echo "$tag"
          }

          YT_DLP="${MANUAL_YT_DLP:-$PINNED_YT_DLP}"
          BGUTIL="${MANUAL_BGUTIL:-$PINNED_BGUTIL}"
          if [ "$EVENT" = "schedule" ]; then
            YT_DLP=$(latest yt-dlp/yt-dlp)
            BGUTIL=$(latest Brainicism/bgutil-ytdlp-pot-provider)
          fi

          BUILD=true
          if [ "$EVENT" = "schedule" ] && [ "$YT_DLP" = "$PINNED_YT_DLP" ] && [ "$BGUTIL" = "$PINNED_BGUTIL" ]; then
            BUILD=false
          fi

          {
            echo "yt_dlp=$YT_DLP"
            echo "bgutil=$BGUTIL"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "yt-dlp: $PINNED_YT_DLP -> $YT_DLP | bgutil: $PINNED_BGUTIL -> $BGUTIL | build: $BUILD"

  docker:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      YT_DLP: ${{ needs.check.outputs.yt_dlp }}
      BGUTIL: ${{ needs.check.outputs.bgutil }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Bump pinned versions in Makefile
        id: bump
        run: |
          set -euo pipefail
          sed -i "s|^YT_DLP_VERSION :=.*|YT_DLP_VERSION := $YT_DLP|" media-toolbox/Makefile
          sed -i "s|^# https://github.com/yt-dlp/yt-dlp/releases/tag/.*|# https://github.com/yt-dlp/yt-dlp/releases/tag/$YT_DLP|" media-toolbox/Makefile
          sed -i "s|^BGUTIL_YTDLP_POT_PROVIDER_VERSION :=.*|BGUTIL_YTDLP_POT_PROVIDER_VERSION := $BGUTIL|" media-toolbox/Makefile
          if git diff --quiet -- media-toolbox/Makefile; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff -- media-toolbox/Makefile
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: media-toolbox
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/nlopez/media-toolbox:${{ env.YT_DLP }}
            ghcr.io/nlopez/media-toolbox:${{ env.YT_DLP }}-${{ github.run_number }}
            ghcr.io/nlopez/media-toolbox:${{ env.YT_DLP }}-${{ github.sha }}
            ghcr.io/nlopez/media-toolbox:${{ github.sha }}
          labels: |
            org.opencontainers.image.description=Media Toolbox: A Docker-based development environment with audio/video/CLI tools for media processing.
          build-args: |
            UID=1001
            GID=1001
            YT_DLP_VERSION=${{ env.YT_DLP }}
            BGUTIL_YTDLP_POT_PROVIDER_VERSION=${{ env.BGUTIL }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/nlopez/media-toolbox:build-cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/nlopez/media-toolbox:build-cache,mode=max
      -
        name: Commit version bump
        if: steps.bump.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-toolbox/Makefile
          git commit -m "chore: bump yt-dlp to $YT_DLP, bgutil to $BGUTIL [skip ci]"
          git push origin HEAD:main
