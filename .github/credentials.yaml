# Credentials that expire. The weekly Credential expiry workflow
# (.github/workflows/credential-expiry.yaml) keeps a "Credentials expiring"
# issue open while any of these is within 30 days of its expiry, or past it.
# Add an entry when you create an expiring credential (SECRETS.md, "Asking for
# a credential"), and update `expires` when you rotate one.
- name: Argo CD ci account token
  vault: ci
  item: zgcjjnf42rmm75gsktjnim4ega
  expires: 2027-11-26
  used_by: .github/workflows/kubernetes-sync-check.yaml
  rotate: >-
    argocd account generate-token --account ci --id ci-sync-check --expires-in 8760h,
    then replace the item's token field and revoke the old token id.
- name: GitHub fine-grained token homelab-github-plan
  vault: ci-pr
  item: vukfxxy3rzdftoairtlz243dga
  expires: 2027-11-25
  used_by: github/secrets.plan.env
  rotate: >-
    Regenerate the token at github.com/settings/personal-access-tokens (same
    read-only permissions), then replace the item's token field.
- name: Cloudflare token ddclient gw.lga1 (lga1.desertbluffs.com)
  vault: operator
  item: 57jinigx355q4xgbvtdd4k4bx4
  expires: 2027-11-27
  used_by: gw.lga1 Services > Dynamic DNS (GUI config, not in this repo)
  rotate: >-
    cf user tokens create with DNS Write on zone desertbluffs.com only and an
    expiry one year out, then replace the item's credential field and the
    password on gw.lga1's Dynamic DNS account, and delete the old token with
    cf user tokens delete <id> --force.
