name: tofu plan comment
description: >-
  Plan an OpenTofu stack without taking the state lock and post the plan as a
  pull request comment. Each stack keeps one comment, found by a marker and
  updated on every push. Provider credentials come from the job environment.

inputs:
  working-directory:
    description: Directory of the stack
    required: true
  title:
    description: Heading of the comment; also identifies it across pushes
    required: true
  plan-args:
    description: Extra arguments for tofu plan
    required: false
    default: ""
  tofu-version:
    description: OpenTofu version
    required: true

runs:
  using: composite
  steps:
    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ inputs.tofu-version }}
        tofu_wrapper: false

    - name: Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_ARGS: ${{ inputs.plan-args }}
      run: |-
        set -o pipefail
        tofu init -input=false -no-color 2>&1 | tee plan.log
        # The state lock needs write access, which pull requests don't get.
        # shellcheck disable=SC2086
        tofu plan -input=false -lock=false -no-color ${PLAN_ARGS} -out=tfplan 2>&1 | tee -a plan.log
        tofu show -no-color tfplan > plan.txt

    # ci-ok reads the plan-destroys annotation and fails until a code owner
    # adds the destroy-approved label (.github/workflows/ci-gate-protected.yaml).
    - name: Check for destroys and replaces
      if: steps.plan.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ inputs.title }}
        REPO: ${{ github.repository }}
      run: |-
        set -euo pipefail
        tofu show -json tfplan | "${GITHUB_WORKSPACE}/.github/scripts/plan-destroys.sh" > destroys.txt
        if [ -s destroys.txt ]; then
          echo "::warning title=plan-destroys::${TITLE}: $(paste -sd ',' destroys.txt)"
          gh label create destroy-approved --repo "${REPO}" --color B60205 \
            --description "A code owner approved the destroys and replaces in this PR's plans" 2>/dev/null || true
        fi

    # The full plan goes to the job summary. One line about it goes on the
    # check run as a plan-result annotation, which ci-ok's summary comment
    # reads, so the PR gets one comment rather than one per stack (each new
    # comment emails the PR's author).
    - name: Report plan
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTCOME: ${{ steps.plan.outcome }}
        TITLE: ${{ inputs.title }}
      run: |-
        summary="$(grep -E '^(Plan:|No changes\.)' plan.log 2>/dev/null | tail -n 1 || true)"
        {
          echo "### ${TITLE} plan (${OUTCOME})"
          echo
          echo "${summary:-See the run log.}"
          echo
          if [ -s destroys.txt ]; then
            echo "**Destroys or replaces:** \`ci-ok\` fails until a code owner adds the \`destroy-approved\` label."
            echo
            sed 's/^/- `/; s/ (/` (/' destroys.txt
            echo
          fi
          if [ "$OUTCOME" = success ]; then
            "${GITHUB_WORKSPACE}/.github/scripts/plan-diff.sh" < plan.txt
          else
            echo '```text'
            tail -c 60000 plan.log 2>/dev/null
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        # A workflow command's message is one line, with % escaped.
        result="$(jq -cn --arg stack "$TITLE" --arg outcome "$OUTCOME" --arg summary "$summary" \
          '{stack: $stack, outcome: $outcome, summary: $summary}')"
        echo "::notice title=plan-result::${result//%/%25}"
