# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  # This directory (the root itself and the delete guard), and one Application per
  # kubernetes/apps/<name>/application.yaml. Each Application's sync-wave orders
  # them on a fresh cluster.
  sources:
  - repoURL: https://github.com/nlopez/homelab.git
    path: kubernetes/bootstrap
    targetRevision: main
  - repoURL: https://github.com/nlopez/homelab.git
    path: kubernetes/apps
    targetRevision: main
    directory:
      recurse: true
      include: '*/application.yaml'
