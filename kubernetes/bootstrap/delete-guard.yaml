# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicy-admissionregistration-v1.json
# Deleting the root Application with a cascade deletes every Application it manages
# and, through each one's resources finalizer, everything those apps run. Refuse it
# unless the root is first annotated homelab/allow-delete=true.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-delete-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["argoproj.io"]
      apiVersions: ["*"]
      operations: ["DELETE"]
      resources: ["applications"]
  validations:
  - expression: >-
      oldObject.metadata.name != 'bootstrap' || (has(oldObject.metadata.annotations) && 'homelab/allow-delete' in oldObject.metadata.annotations && oldObject.metadata.annotations['homelab/allow-delete']
      == 'true')
    messageExpression: >-
      'Deleting Application bootstrap deletes every app under it. Annotate it homelab/allow-delete=true first.'
