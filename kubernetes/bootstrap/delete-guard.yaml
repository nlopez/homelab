# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicy-admissionregistration-v1.json
# Deleting the root Application or an ApplicationSet deletes every app under it
# and, through each Application's resources finalizer, everything those apps run.
# Refuse it unless the object is first annotated homelab/allow-delete=true.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-delete-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["argoproj.io"]
      apiVersions: ["*"]
      operations: ["DELETE"]
      resources: ["applications", "applicationsets"]
  validations:
  - expression: >-
      !(oldObject.metadata.name in ['bootstrap', 'apps']) || (has(oldObject.metadata.annotations) && 'homelab/allow-delete' in oldObject.metadata.annotations && oldObject.metadata.annotations['homelab/allow-delete']
      == 'true')
    messageExpression: >-
      'Deleting ' + oldObject.kind + ' ' + oldObject.metadata.name + ' deletes every app under it. Annotate it homelab/allow-delete=true first.'
