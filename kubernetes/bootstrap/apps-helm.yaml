# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - network-and-secrets
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - storage
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - platform
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - name: cilium
        tier: network-and-secrets
        repoURL: https://helm.cilium.io
        chart: cilium
        targetRevision: "1.20.4"
        namespace: kube-system
      - name: envoy-gateway
        tier: network-and-secrets
        repoURL: oci://docker.io/envoyproxy/gateway-helm
        targetRevision: 1.9.3
        namespace: envoy-gateway-system
      - name: tailscale-operator
        tier: network-and-secrets
        repoURL: https://pkgs.tailscale.com/helmcharts
        chart: tailscale-operator
        targetRevision: "1.104.7"
        namespace: tailscale
      - name: external-dns
        tier: network-and-secrets
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: "1.23.0"
        namespace: external-dns
      - name: technitium
        tier: network-and-secrets
        repoURL: https://charts.obeone.cloud
        chart: technitium-dnsserver
        targetRevision: "1.13.5"
        namespace: technitium
      - name: onepassword-connect
        tier: network-and-secrets
        repoURL: https://1password.github.io/connect-helm-charts
        chart: connect
        targetRevision: "2.4.3"
        namespace: 1password
      - name: cert-manager
        tier: network-and-secrets
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.21.3
        namespace: cert-manager
      - name: truenas-csi-nas2
        tier: storage
        repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
        chart: truenas-csi
        targetRevision: "1.4.0"
        namespace: truenas-csi-nas2
      - name: truenas-csi-nas1
        tier: storage
        repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
        chart: truenas-csi
        targetRevision: "1.4.0"
        namespace: truenas-csi-nas1
      - name: velero
        tier: storage
        repoURL: https://vmware-tanzu.github.io/helm-charts
        chart: velero
        targetRevision: '12.2.2'
        namespace: velero
      - name: cloudnative-pg
        tier: storage
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: "0.29.1"
        namespace: cnpg-system
      - name: argocd
        tier: platform
        repoURL: "https://argoproj.github.io/argo-helm"
        chart: argo-cd
        targetRevision: '10.11.6'
        namespace: argocd
      - name: argocd-diff-preview
        tier: platform
        repoURL: "https://argoproj.github.io/argo-helm"
        chart: argo-cd
        targetRevision: '10.11.6'
        namespace: argocd-diff-preview
      - name: metrics-server
        tier: platform
        repoURL: https://kubernetes-sigs.github.io/metrics-server
        chart: metrics-server
        targetRevision: "3.14.0"
        namespace: kube-system
      - name: reloader
        tier: platform
        repoURL: https://stakater.github.io/stakater-charts
        chart: reloader
        targetRevision: "2.2.19"
        namespace: reloader
      - name: node-feature-discovery
        tier: platform
        repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
        chart: node-feature-discovery
        targetRevision: "0.20.1"
        namespace: node-feature-discovery
      - name: intel-device-plugins-gpu
        tier: platform
        repoURL: https://intel.github.io/helm-charts
        chart: intel-device-plugins-gpu
        targetRevision: "0.37.1"
        namespace: intel-device-plugins-gpu
      - name: jellyfin
        tier: platform
        repoURL: https://jellyfin.github.io/jellyfin-helm
        chart: jellyfin
        targetRevision: "3.7.0"
        namespace: jellyfin
      - name: immich
        tier: platform
        repoURL: oci://ghcr.io/immich-app/immich-charts/immich
        targetRevision: '0.13.4'
        namespace: immich
      - name: spegel
        tier: platform
        repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
        targetRevision: "0.8.1"
        namespace: spegel
      - name: goldpinger
        tier: platform
        repoURL: https://bloomberg.github.io/goldpinger
        chart: goldpinger
        targetRevision: "1.2.0"
        namespace: goldpinger
      - name: datadog
        tier: platform
        repoURL: https://helm.datadoghq.com
        chart: datadog
        targetRevision: "3.264.0"
        namespace: datadog
      - name: arc-controller
        tier: platform
        repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
        targetRevision: "0.15.1"
        namespace: arc-systems
      - name: arc-runners
        tier: platform
        repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
        targetRevision: "0.15.1"
        namespace: arc-runners
  template:
    metadata:
      name: "{{.name}}"
      labels:
        tier: "{{.tier}}"
    spec:
      project: default
      ignoreDifferences:
      - kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/volumeName
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    spec:
    {{- if eq .name "cilium" }}
      annotations:
        argocd.argoproj.io/compare-options: {{ "ServerSideDiff=false" | quote }}
    {{- end }}
    {{- if eq .name "immich" }}
      ignoreDifferences:
      - kind: PersistentVolumeClaim
        name: immich-valkey
        jsonPointers:
        - /spec/volumeName
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
    {{- end }}
    {{- if eq .name "velero" }}
      ignoreDifferences:
      - kind: ConfigMap
        name: velero-notifier-state
        jsonPointers:
        - /data/activeSince
        - /data/state
    {{- end }}
      sources:
      - repoURL: '{{.repoURL}}'
        {{- if regexMatch "^oci://" .repoURL }}
        path: .
        {{- else }}
        chart: '{{.chart}}'
        {{- end }}
        targetRevision: '{{.targetRevision}}'
        helm:
          valueFiles:
          - $values/kubernetes/apps-helm/{{.name}}/values.yaml
          ignoreMissingValueFiles: true
      - repoURL: 'https://github.com/nlopez/homelab.git'
        targetRevision: main
        ref: values
      - repoURL: 'https://github.com/nlopez/homelab.git'
        targetRevision: main
        path: kubernetes/apps-helm/{{.name}}/manifests
