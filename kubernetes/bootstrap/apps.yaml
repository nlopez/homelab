# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    # Deleting this ApplicationSet deletes every app under kubernetes/apps/ and its resources.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/nlopez/homelab.git
      revision: main
      directories:
      - path: kubernetes/apps/*
      - path: kubernetes/apps/*/overlays/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      ignoreDifferences:
      - kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/volumeName
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
      sources:
      - repoURL: "https://github.com/nlopez/homelab.git"
        targetRevision: main
        path: "{{.path.path}}"
        directory:
          recurse: true
      destination:
        namespace: "{{.path.basename}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    {{- $patchedName := .path.basename }}
    {{- $patchedNamespace := .path.basename }}
    {{- if gt (len .path.segments) 3 }}
    {{- $patchedName = printf "%s-%s" (index .path.segments 2) .path.basename -}}
    {{- $patchedNamespace = printf "%s" (index .path.segments 2) -}}
    {{- end }}
    metadata:
      name: '{{ $patchedName }}'
    spec:
      destination:
        namespace: '{{ $patchedNamespace }}'
