# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-lga2
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  destination:
    namespace: external-dns-lga2
    server: https://kubernetes.default.svc
  sources:
  - repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: "1.23.0"
    helm:
      valueFiles:
      - $values/kubernetes/apps-helm/external-dns-lga2/values.yaml
      ignoreMissingValueFiles: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps-helm/external-dns-lga2/manifests
