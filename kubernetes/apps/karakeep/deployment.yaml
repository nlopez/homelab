# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
        app.kubernetes.io/name: karakeep
        app.kubernetes.io/instance: karakeep
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: karakeep
        tags.datadoghq.com/version: v0.35.0
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: karakeep
        image: ghcr.io/karakeep-app/karakeep:0.35.0
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        env:
        - name: DATA_DIR
          value: /data
        - name: NEXTAUTH_URL
          value: https://kxxx.desertbluffs.com
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: nextauth-secret
        - name: OAUTH_WELLKNOWN_URL
          value: https://arsox.desertbluffs.com/application/o/karakeep/.well-known/openid-configuration
        - name: OAUTH_CLIENT_ID
          value: karakeep
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: client-secret
        - name: OAUTH_SCOPE
          value: openid email profile
        - name: OAUTH_PROVIDER_NAME
          value: Authentik
        - name: OAUTH_AUTO_REDIRECT
          value: "true"
        - name: DISABLE_PASSWORD_AUTH
          value: "true"
        - name: OAUTH_TOKEN_ENDPOINT_AUTH_METHOD
          value: client_secret_basic
        - name: MEILI_ADDR
          value: http://localhost:7700
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: meili-master-key
        - name: BROWSER_WEB_URL
          value: http://localhost:9222
        ports:
        - name: http
          containerPort: 3000
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
      - name: chrome
        image: ghcr.io/karakeep-app/karakeep-chrome:0.35.0
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        ports:
        - name: chrome
          containerPort: 9222
        securityContext:
          allowPrivilegeEscalation: false
      - name: meilisearch
        image: getmeili/meilisearch:v1.55.0
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        env:
        - name: MEILI_NO_ANALYTICS
          value: "true"
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: meili-master-key
        ports:
        - name: meili
          containerPort: 7700
        volumeMounts:
        - name: data
          mountPath: /meili_data
          subPath: meilisearch
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
