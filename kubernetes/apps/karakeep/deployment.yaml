# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  annotations:
    secret.reloader.stakater.com/reload: "onepassword-karakeep"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
        app.kubernetes.io/name: karakeep
        app.kubernetes.io/instance: karakeep
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: karakeep
        tags.datadoghq.com/version: v0.35.0
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: karakeep
        image: ghcr.io/karakeep-app/karakeep:0.35.0
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        env:
        - name: DATA_DIR
          value: /data
        - name: NEXTAUTH_URL
          value: https://spheal.desertbluffs.com
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: nextauth-secret
        - name: OAUTH_WELLKNOWN_URL
          value: https://arsox.desertbluffs.com/application/o/karakeep/.well-known/openid-configuration
        - name: OAUTH_CLIENT_ID
          value: karakeep
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: client-secret
        - name: OAUTH_SCOPE
          value: openid email profile
        - name: OAUTH_PROVIDER_NAME
          value: Authentik
        - name: OAUTH_AUTO_REDIRECT
          value: "true"
        - name: DISABLE_PASSWORD_AUTH
          value: "true"
        - name: OAUTH_TOKEN_ENDPOINT_AUTH_METHOD
          value: client_secret_basic
        - name: MEILI_ADDR
          value: http://localhost:7700
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: meili-master-key
        - name: BROWSER_WEB_URL
          value: http://localhost:9222
        - name: BROWSER_COOKIE_PATH
          value: /config/browser-cookies.json
        - name: CRAWLER_HTTP_PROXY
          value: http://warp.warp.svc.cluster.local:8888
        - name: CRAWLER_HTTPS_PROXY
          value: http://warp.warp.svc.cluster.local:8888
        - name: OPENAI_BASE_URL
          value: https://openrouter.ai/api/v1
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: openrouter-api-key
        - name: INFERENCE_TEXT_MODEL
          value: meta-llama/llama-4-scout
        - name: INFERENCE_IMAGE_MODEL
          value: meta-llama/llama-4-scout
        - name: EMBEDDING_TEXT_MODEL
          value: openai/text-embedding-3-small
        # Off by default with a custom OPENAI_BASE_URL; this model's 1536 dimensions match the default.
        - name: EMBEDDING_ENABLE_AUTO_INDEXING
          value: "true"
        ports:
        - name: http
          containerPort: 3000
        volumeMounts:
        - name: data
          mountPath: /data
        - name: browser-cookies
          mountPath: /config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
      - name: chrome
        image: ghcr.io/karakeep-app/karakeep-chrome:release
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        ports:
        - name: chrome
          containerPort: 9222
        securityContext:
          allowPrivilegeEscalation: false
      - name: meilisearch
        image: getmeili/meilisearch:v1.55.0
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        env:
        - name: MEILI_NO_ANALYTICS
          value: "true"
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-karakeep
              key: meili-master-key
        ports:
        - name: meili
          containerPort: 7700
        volumeMounts:
        - name: data
          mountPath: /meili_data
          subPath: meilisearch
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: browser-cookies
        secret:
          secretName: onepassword-karakeep
          items:
          - key: reddit-cookies
            path: browser-cookies.json
