# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Karakeep
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: karakeep.png
    gethomepage.dev/description: Bookmarks and web archive
    gethomepage.dev/pod-selector: app=karakeep
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  - name: internet
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - spheal.desertbluffs.com
  rules:
  - backendRefs:
    - name: karakeep
      port: 80
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
