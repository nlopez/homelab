# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wan-ip
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: wan-ip
            tags.datadoghq.com/version: v1
        spec:
          serviceAccountName: wan-ip
          restartPolicy: Never
          dnsConfig:
            options:
            - name: ndots
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: wan-ip
            image: docker.io/alpine/k8s:1.36.5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            env:
            - name: HOME
              value: /tmp
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            command:
            - /bin/sh
            - -eu
            - -c
            - |-
              # Pods reach the internet through the lga1 gateway's NAT, so the address
              # these services see is the WAN address Cloudflare must use as the origin.
              a=$(curl -4 -fsS --max-time 10 https://api.ipify.org)
              b=$(curl -4 -fsS --max-time 10 https://cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
              if ! echo "${a}" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                echo "ipify returned an invalid address: '${a}'" >&2; exit 1
              fi
              if [ "${a}" != "${b}" ]; then
                echo "WAN address sources disagree: ipify=${a} cloudflare=${b}" >&2; exit 1
              fi
              echo "WAN address ${a}"

              # Publish every internet route as A (WAN address) and AAAA (the gateway's
              # public IPv6 address).
              ns=envoy-gateway-system
              v6=$(kubectl get gateway -n "${ns}" internet -o jsonpath='{.status.addresses[*].value}' | tr ' ' '\n' | grep ':' | grep -v -i '^fd' | head -n 1 || true)
              target="${a}"
              [ -n "${v6}" ] && target="${a},${v6}"
              current=$(kubectl get gateway -n "${ns}" internet -o jsonpath='{.metadata.annotations.external-dns\.kubernetes\.io/target}')
              if [ "${current}" != "${target}" ]; then
                kubectl annotate gateway -n "${ns}" internet --overwrite "external-dns.kubernetes.io/target=${target}"
                echo "internet gateway target ${current:-unset} -> ${target}"
              fi
          volumes:
          - name: tmp
            emptyDir: {}
