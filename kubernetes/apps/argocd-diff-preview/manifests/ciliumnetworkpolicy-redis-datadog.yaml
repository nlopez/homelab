# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
# The chart's argocd-redis NetworkPolicy only admits Argo CD components. This
# adds the Datadog agent so its Redis check keeps collecting.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-redis-datadog
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argocd-diff-preview
      app.kubernetes.io/name: argocd-redis
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: datadog
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
