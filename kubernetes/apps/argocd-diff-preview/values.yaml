namespaceOverride: argocd-diff-preview
createClusterRoles: false
crds:
  install: false
notifications:
  enabled: false
dex:
  enabled: false
applicationSet:
  replicas: 0
controller:
  roleRules:
  - apiGroups:
    - "*"
    resources:
    - "*"
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - argoproj.io
    resources:
    - applications
    - applications/status
    verbs:
    - get
    - list
    - watch
    - update
    - patch
