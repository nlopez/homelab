# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-diff-preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-diff-preview
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.11.6
    helm:
      valueFiles:
      - $values/kubernetes/apps/argocd-diff-preview/values.yaml
      ignoreMissingValueFiles: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/argocd-diff-preview/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
