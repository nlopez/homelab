# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/k8s.mariadb.com/backup_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: mariadb-daily
spec:
  mariaDbRef:
    name: mariadb
  schedule:
    cron: "0 3 * * *"
  maxRetention: 336h
  compression: gzip
  storage:
    s3:
      bucket: homelab-cnpg-backups-1sslgx
      prefix: seafile-mariadb
      endpoint: sfo3.digitaloceanspaces.com
      region: sfo3
      accessKeyIdSecretKeyRef:
        name: cnpg-backups-spaces
        key: ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: cnpg-backups-spaces
        key: ACCESS_SECRET_KEY
      tls:
        enabled: true
