apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cnpg-backups-spaces
spec:
  itemPath: "vaults/evjh25ux2mnoufaut6qhvm2pdi/items/uvfekeu7grfa7wzz2pe33rticq"
