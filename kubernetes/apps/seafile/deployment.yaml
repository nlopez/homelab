# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
spec:
  selector:
    matchLabels:
      app: seafile
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: seafile
        app.kubernetes.io/name: seafile
        app.kubernetes.io/instance: seafile
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: seafile
        tags.datadoghq.com/version: v1
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seafile
        image: seafileltd/seafile-mc:13.0.30
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        env:
        - name: TIME_ZONE
          value: America/New_York
        - name: SEAFILE_SERVER_HOSTNAME
          value: seafile.desertbluffs.com
        - name: SEAFILE_SERVER_PROTOCOL
          value: https
        - name: SEAFILE_MYSQL_DB_HOST
          value: mariadb
        - name: SEAFILE_MYSQL_DB_USER
          value: seafile
        - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
          value: ccnet_db
        - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
          value: seafile_db
        - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
          value: seahub_db
        - name: SEAFILE_MYSQL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: mysql-password
        - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: mysql-root-password
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: jwt-private-key
        - name: INIT_SEAFILE_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: admin-email
        - name: INIT_SEAFILE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: admin-password
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile-smtp
              key: host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile-smtp
              key: port
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile-smtp
              key: username
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile-smtp
              key: password
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile-smtp
              key: from
        - name: CACHE_PROVIDER
          value: redis
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-seafile
              key: redis-password
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /api2/ping/
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api2/ping/
            port: http
          initialDelaySeconds: 120
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /shared
        - name: local-settings
          mountPath: /opt/seafile/seafile-server-latest/seahub/seahub/local_settings.py
          subPath: local_settings.py
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: local-settings
        configMap:
          name: seahub-local-settings
