apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-redis-reader
  namespace: seafile
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["seafile-redis"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-redis-reader
  namespace: seafile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-redis-reader
subjects:
- kind: ServiceAccount
  name: datadog
  namespace: datadog
