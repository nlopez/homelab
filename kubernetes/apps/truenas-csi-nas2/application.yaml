# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-csi-nas2
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: truenas-csi-nas2
  sources:
  - repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
    chart: truenas-csi
    targetRevision: 1.4.0
    helm:
      valueFiles:
      - $values/kubernetes/apps/truenas-csi-nas2/values.yaml
      ignoreMissingValueFiles: true
      parameters:
      - name: controller.podLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
      - name: node.podLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/truenas-csi-nas2/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
