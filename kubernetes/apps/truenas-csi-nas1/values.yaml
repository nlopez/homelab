driverName: org.truenas-csi.nas1
fullnameOverride: truenas-csi-nas1
healthPort: 9809
logLevel: 2
truenas:
  url: wss://nas1.lga1.radoncanyon.com
  iscsiPortal: "192.168.222.149:3260"
  defaultPool: mtank
  existingSecret: truenas-csi-nas1-api-key
  existingSecretKey: credential
controller:
  podAnnotations:
    ad.datadoghq.com/csi-controller.logs: '[{"source":"truenas-csi","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
    ad.datadoghq.com/csi-provisioner.logs: '[{"source":"csi-provisioner","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
    ad.datadoghq.com/csi-attacher.logs: '[{"source":"csi-attacher","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
    ad.datadoghq.com/csi-snapshotter.logs: '[{"source":"csi-snapshotter","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
    ad.datadoghq.com/csi-resizer.logs: '[{"source":"csi-resizer","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: truenas-csi-nas1
    tags.datadoghq.com/version: v1
node:
  podAnnotations:
    ad.datadoghq.com/csi-node.logs: '[{"source":"truenas-csi","service":"truenas-csi-nas1","log_processing_rules":[{"type":"exclude_at_match","name":"klog_info","pattern":"^I[0-9]{4} "}]}]'
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: truenas-csi-nas1
    tags.datadoghq.com/version: v1
storageClasses:
- name: tn-nas1-mtank-nfs
  reclaimPolicy: Retain
  parameters:
    protocol: nfs
    pool: mtank
    datasetPath: k8s/nfs
- name: tn-nas1-mtank-iscsi
  reclaimPolicy: Retain
  parameters:
    protocol: iscsi
    pool: mtank
    datasetPath: k8s/iscsi
    volblocksize: 16K
    iscsi.initiators: iqn.2014-09.com.radoncanyon:knode1,iqn.2014-09.com.radoncanyon:knode2
- name: tn-nas1-etank-nfs
  reclaimPolicy: Retain
  parameters:
    protocol: nfs
    pool: etank
    datasetPath: k8s/nfs
- name: tn-nas1-etank-iscsi
  reclaimPolicy: Retain
  parameters:
    protocol: iscsi
    pool: etank
    datasetPath: k8s/iscsi
    volblocksize: 16K
    iscsi.initiators: iqn.2014-09.com.radoncanyon:knode1,iqn.2014-09.com.radoncanyon:knode2
- name: tn-nas1-etank-nfs-scratch
  reclaimPolicy: Delete
  parameters:
    protocol: nfs
    pool: etank
    datasetPath: k8s/nfs-scratch
- name: tn-nas1-etank-iscsi-scratch
  reclaimPolicy: Delete
  parameters:
    protocol: iscsi
    pool: etank
    datasetPath: k8s/iscsi-scratch
    volblocksize: 16K
    iscsi.initiators: iqn.2014-09.com.radoncanyon:knode1,iqn.2014-09.com.radoncanyon:knode2
