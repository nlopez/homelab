# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  labels:
    app: forgejo-runner
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: forgejo-runner
        tags.datadoghq.com/version: "13.2.2" # renovate: image=code.forgejo.org/forgejo/runner
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: dind
        image: docker.io/library/docker:29.10.0-dind
        restartPolicy: Always
        args:
        - dockerd
        - --host=unix:///run/dind/docker.sock
        - --group=1000
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "-H", "unix:///run/dind/docker.sock", "info"]
          periodSeconds: 2
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 8Gi
        volumeMounts:
        - name: docker
          mountPath: /var/lib/docker
        - name: docker-socket
          mountPath: /run/dind
      containers:
      - name: runner
        image: code.forgejo.org/forgejo/runner:13.2.2
        workingDir: /data
        command:
        - forgejo-runner
        - daemon
        - --config
        - /config/config.yml
        env:
        - name: DOCKER_HOST
          value: unix:///run/dind/docker.sock
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: token
          mountPath: /secrets
          readOnly: true
        - name: data
          mountPath: /data
        - name: docker-socket
          mountPath: /run/dind
      volumes:
      - name: docker-socket
        emptyDir: {}
      - name: config
        configMap:
          name: forgejo-runner-config
      - name: token
        secret:
          secretName: onepassword-forgejo-runner
          items:
          - key: token
            path: token
      - name: data
        emptyDir: {}
      - name: docker
        emptyDir:
          sizeLimit: 50Gi
