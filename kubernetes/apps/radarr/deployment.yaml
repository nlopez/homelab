# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
    version: v1
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: radarr
    tags.datadoghq.com/version: v1
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
      version: v1
  template:
    metadata:
      labels:
        app: radarr
        version: v1
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: radarr
        tags.datadoghq.com/version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: radarr
        image: ghcr.io/linuxserver/radarr:version-6.4.4.10685
        resources:
          requests:
            cpu: 50m
            memory: 320Mi
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: "America/New_York"
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "1"
        # authentik signs browsers in at the gateway (gateway-oidc.yaml).
        - name: RADARR__AUTH__METHOD
          value: External
        - name: RADARR__POSTGRES__HOST
          value: radarr-database-tn-rw
        - name: RADARR__POSTGRES__PORT
          value: "5432"
        - name: RADARR__POSTGRES__USER
          value: radarr
        - name: RADARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-radarr-database
              key: password
        - name: RADARR__POSTGRES__MAINDB
          value: radarr-main
        - name: RADARR__POSTGRES__LOGDB
          value: radarr-log
        ports:
        - name: http
          containerPort: 7878
        livenessProbe:
          httpGet:
            port: http
            path: /ping
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: run
          mountPath: /run
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: media
        persistentVolumeClaim:
          claimName: media
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
