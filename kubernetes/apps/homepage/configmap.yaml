# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
data:
  kubernetes.yaml: |-
    mode: cluster
    ingress: false
    gateway: true
  settings.yaml: |-
    title: Homelab
    headerStyle: clean
    layout: {}
  services.yaml: |-
    - Storage:
        - nas1:
            href: https://nas1.lga1.radoncanyon.com/ui/
            icon: truenas.png
            description: TrueNAS
        - nas2:
            href: https://nas2.lga1.radoncanyon.com/ui/
            icon: truenas.png
            description: TrueNAS
    - Network:
        - gw.lga1:
            href: https://gw.lga1.radoncanyon.com/
            icon: mdi-router-network
            description: Gateway
        - gw.lga2:
            href: https://gw.lga2.radoncanyon.com/
            icon: mdi-router-network
            description: Gateway
  widgets.yaml: |-
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  bookmarks.yaml: |-
    []
  docker.yaml: |-
    {}
  proxmox.yaml: |-
    {}
  custom.css: ""
  custom.js: ""
