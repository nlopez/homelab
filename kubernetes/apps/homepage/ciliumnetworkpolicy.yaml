# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
# Only the gateway reaches the app, so authentik (gateway-oidc.yaml) can't be
# bypassed by calling the pod directly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-ingress
spec:
  endpointSelector:
    matchLabels:
      app: homepage
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: envoy-gateway-system
        app.kubernetes.io/component: proxy
        app.kubernetes.io/managed-by: envoy-gateway
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  - fromEntities:
    - host
