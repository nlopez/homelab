# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
    version: v1
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: sonarr
    tags.datadoghq.com/version: v1
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
      version: v1
  template:
    metadata:
      labels:
        app: sonarr
        version: v1
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: sonarr
        tags.datadoghq.com/version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sonarr
        image: ghcr.io/linuxserver/sonarr:version-4.0.20.3014
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: "America/New_York"
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "1"
        # authentik signs browsers in at the gateway (gateway-oidc.yaml).
        - name: SONARR__AUTH__METHOD
          value: External
        - name: SONARR__POSTGRES__HOST
          value: sonarr-database-tn-rw
        - name: SONARR__POSTGRES__PORT
          value: "5432"
        - name: SONARR__POSTGRES__USER
          value: sonarr
        - name: SONARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-sonarr-database
              key: password
        - name: SONARR__POSTGRES__MAINDB
          value: sonarr-main
        - name: SONARR__POSTGRES__LOGDB
          value: sonarr-log
        ports:
        - name: http
          containerPort: 8989
        command: ["sh", "-c", "rm -rf /run/* /run/.[!.]*; exec /init"]
        readinessProbe:
          httpGet:
            port: http
            path: /ping
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            port: http
            path: /ping
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: scratch
          mountPath: /downloads
          subPath: downloads
        - name: run
          mountPath: /run
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: scratch
        persistentVolumeClaim:
          claimName: scratch
      - name: media
        persistentVolumeClaim:
          claimName: media
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
