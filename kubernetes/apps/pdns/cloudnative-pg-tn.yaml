# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pdns-database-tn
spec:
  instances: 1
  storage:
    size: 2Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: tn-nas1-mtank-iscsi
      resources:
        requests:
          storage: 2Gi
  bootstrap:
    initdb:
      database: pdns
      owner: pdns
      secret:
        name: onepassword-pdns-database
