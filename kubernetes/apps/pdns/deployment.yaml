# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns
  labels:
    app: pdns
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: pdns
    tags.datadoghq.com/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdns
  template:
    metadata:
      labels:
        app: pdns
    spec:
      initContainers:
      # The gpgsql schema is applied once; every later start skips it.
      - name: schema
        image: docker.io/library/postgres:17
        command:
        - sh
        - -c
        - |
          until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
          if [ "$(psql -tAc "select count(*) from pg_tables where tablename = 'domains'")" = "0" ]; then
            psql -v ON_ERROR_STOP=1 -f /schema/schema.pgsql.sql
          fi
        env:
        - name: PGHOST
          value: pdns-database-tn-rw
        - name: PGDATABASE
          value: pdns
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: onepassword-pdns-database
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-pdns-database
              key: password
        volumeMounts:
        - name: schema
          mountPath: /schema
      # The password cannot live in the ConfigMap, so the file is rendered
      # from the environment before pdns starts.
      - name: config
        image: docker.io/library/alpine:3.20
        command:
        - sh
        - -c
        - |
          cat > /conf/pdns.conf <<CONF
          launch=gpgsql
          gpgsql-host=${PGHOST}
          gpgsql-port=5432
          gpgsql-dbname=pdns
          gpgsql-user=${PGUSER}
          gpgsql-password=${PGPASSWORD}
          gpgsql-dnssec=no
          api=yes
          api-key=${PDNS_API_KEY}
          webserver=yes
          webserver-address=0.0.0.0
          webserver-port=8081
          webserver-allow-from=0.0.0.0/0,::/0
          local-address=0.0.0.0
          local-port=5353
          disable-syslog=yes
          daemon=no
          CONF
        env:
        - name: PGHOST
          value: pdns-database-tn-rw
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: onepassword-pdns-database
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: onepassword-pdns-database
              key: password
        - name: PDNS_API_KEY
          valueFrom:
            secretKeyRef:
              name: onepassword-pdns-api-key
              key: password
        volumeMounts:
        - name: conf
          mountPath: /conf
      containers:
      - name: pdns
        image: docker.io/powerdns/pdns-auth-50:5.0.8
        args: ["--config-dir=/conf"]
        ports:
        - name: dns-udp
          containerPort: 5353
          protocol: UDP
        - name: dns-tcp
          containerPort: 5353
          protocol: TCP
        - name: api
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          # The API rejects unauthenticated requests, so probe the socket.
          tcpSocket:
            port: api
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: dns-tcp
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: conf
          mountPath: /conf
      volumes:
      - name: schema
        configMap:
          name: pdns-schema
      - name: conf
        emptyDir: {}
