podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: velero
configuration:
  backupStorageLocation:
  - name: do-spaces-sfo3
    provider: aws
    bucket: k8s-velero-backups-cowardly-tiger
    config:
      region: sfo3
      s3ForcePathStyle: true
      s3Url: https://sfo3.digitaloceanspaces.com
    accessMode: ReadWrite
    default: true
  volumeSnapshotLocation:
  - name: default
    provider: aws
    config:
      region: sfo3
  defaultVolumesToFsBackup: false
  features: EnableCSI
  garbageCollectionFrequency: 1h
credentials:
  useSecret: true
  name: credentials-velero
deployNodeAgent: true
nodeAgent:
  resources: {}
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: velero-node-agent
initContainers:
# The chart doesn't set this plugin's version, and its minor must match
# Velero's (plugin 1.14 for Velero 1.18). When a chart update moves Velero to
# a new minor, bump the plugin in the same PR.
- name: velero-plugin-for-aws
  image: velero/velero-plugin-for-aws:v1.14.4
  volumeMounts:
  - mountPath: /target
    name: plugins
metrics:
  enabled: true
podAnnotations:
  ad.datadoghq.com/velero.logs: '[{"source":"velero","service":"velero","log_processing_rules":[{"type":"exclude_at_match","name":"logrus_info","pattern":"^time=\"[^\"]*\" level=info "}]}]'
  ad.datadoghq.com/node-agent.logs: '[{"source":"velero","service":"velero-node-agent","log_processing_rules":[{"type":"exclude_at_match","name":"logrus_info","pattern":"^time=\"[^\"]*\" level=info "}]}]'
  ad.datadoghq.com/velero.checks: |
    {
      "velero": {
        "init_config": {},
        "instances": [
          {
            "openmetrics_endpoint": "http://%%host%%:8085/metrics"
          }
        ]
      }
    }
  ad.datadoghq.com/node-agent.checks: |
    {
      "velero": {
        "init_config": {},
        "instances": [
          {
            "openmetrics_endpoint": "http://%%host%%:8085/metrics"
          }
        ]
      }
    }
schedules:
  palworld-10min:
    schedule: "*/10 * * * *"
    paused: false
    template:
      includedNamespaces:
      - palworld
      storageLocation: do-spaces-sfo3
      ttl: 1h
      includeClusterResources: false
      snapshotVolumes: true
      snapshotMoveData: false
  palworld-daily:
    schedule: "15 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - palworld
      storageLocation: do-spaces-sfo3
      ttl: 720h
      includeClusterResources: false
      snapshotVolumes: true
      snapshotMoveData: true
      hooks:
        resources:
        - name: palworld-save-and-restart
          includedNamespaces:
          - palworld
          labelSelector:
            matchLabels:
              app: palworld
          pre:
          - exec:
              container: palworld
              command:
              - rest-cli
              - save
              onError: Fail
              timeout: 60s
  palworld-fsb-hourly:
    schedule: "0 * * * *"
    paused: false
    template:
      includedNamespaces:
      - palworld
      storageLocation: do-spaces-sfo3
      ttl: 48h
      includeClusterResources: false
      snapshotVolumes: false
      snapshotMoveData: false
      hooks:
        resources:
        - name: palworld-fsb-save
          includedNamespaces:
          - palworld
          labelSelector:
            matchLabels:
              app: palworld
          pre:
          - exec:
              container: palworld
              command:
              - rest-cli
              - save
              onError: Fail
              timeout: 60s
  palworld-fsb-daily:
    schedule: "15 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - palworld
      storageLocation: do-spaces-sfo3
      ttl: 720h
      includeClusterResources: false
      snapshotVolumes: false
      snapshotMoveData: false
      hooks:
        resources:
        - name: palworld-fsb-save
          includedNamespaces:
          - palworld
          labelSelector:
            matchLabels:
              app: palworld
          pre:
          - exec:
              container: palworld
              command:
              - rest-cli
              - save
              onError: Fail
              timeout: 60s
  obsidian-livesync-daily:
    schedule: "15 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - obsidian-livesync
      storageLocation: do-spaces-sfo3
      ttl: 720h
      includeClusterResources: false
      snapshotVolumes: true
      snapshotMoveData: true
  stateful-apps-daily:
    schedule: "30 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - atuin
      - engram
      - forgejo
      - jellyfin
      - palworld-modded
      - pms
      - radarr
      - recyclarr
      - seadexarr
      - sonarr
      - timekeeper-ash
      - timekeeper-oak
      - warp
      storageLocation: do-spaces-sfo3
      ttl: 336h
      includeClusterResources: false
      snapshotVolumes: true
      snapshotMoveData: true
  immich-daily:
    schedule: "45 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - immich
      storageLocation: do-spaces-sfo3
      ttl: 336h
      includeClusterResources: false
      snapshotVolumes: false
      snapshotMoveData: false
  seafile-daily:
    schedule: "50 11 * * *"
    paused: false
    template:
      includedNamespaces:
      - seafile
      storageLocation: do-spaces-sfo3
      ttl: 336h
      includeClusterResources: false
      snapshotVolumes: false
      snapshotMoveData: false
