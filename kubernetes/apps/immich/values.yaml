global:
  propagateGlobalMetadataToPods: true
  labels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: immich
    tags.datadoghq.com/version: v1
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.4.1 # pin: the immich chart lags the app and expects the tag set
          pullPolicy: IfNotPresent
        env:
          DB_HOSTNAME: immich-database-tn-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_PASSWORD:
            secretKeyRef:
              name: onepassword-immich-database
              key: password
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: immich-valkey.immich.svc.cluster.local
          REDIS_PORT: "6379"
immich:
  configuration: {}
  persistence:
    library:
      existingClaim: immich-library-nfs
valkey:
  enabled: true
  controllers:
    main:
      pod:
        annotations:
          ad.datadoghq.com/main.checks: |-
            {"redisdb":{"init_config":{},"instances":[{"host":"%%host%%","port":6379}]}}
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.2-alpine # pin: valkey data on the PVC was written by 9.2; the chart ships 9.1
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: tn-nas1-mtank-iscsi
server:
  enabled: true
  controllers:
    main:
      replicas: 2
      # Datadog unified service tags, overriding the global ones. The version is
      # the immich release, kept in step with the image tag by Renovate.
      labels:
        tags.datadoghq.com/service: immich-server
        tags.datadoghq.com/version: v3.4.1 # renovate: image=ghcr.io/immich-app/immich-server
      pod:
        labels:
          tags.datadoghq.com/service: immich-server
          tags.datadoghq.com/version: v3.4.1 # renovate: image=ghcr.io/immich-app/immich-server
          admission.datadoghq.com/enabled: "true"
        # The Datadog admission controller injects dd-trace-js from this
        # dd-lib-js-init image tag for APM and Code Security. Renovate updates it.
        annotations:
          admission.datadoghq.com/js-lib.version: v6.26.0
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.4.1 # pin: the immich chart lags the app and expects the tag set
            pullPolicy: IfNotPresent
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          env:
            IMMICH_FFMPEG_HWACCEL: qsv
            IMMICH_LOG_FORMAT: json
            DD_IAST_ENABLED: "true"
            DD_APPSEC_SCA_ENABLED: "true"
            DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
  persistence:
    icloud:
      enabled: true
      existingClaim: immich-icloud-nfs
      advancedMounts:
        main:
          main:
          - path: /icloud
            readOnly: true
machine-learning:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      labels:
        tags.datadoghq.com/service: immich-machine-learning
        tags.datadoghq.com/version: v3.4.1 # renovate: image=ghcr.io/immich-app/immich-server
      pod:
        labels:
          tags.datadoghq.com/service: immich-machine-learning
          tags.datadoghq.com/version: v3.4.1 # renovate: image=ghcr.io/immich-app/immich-server
          admission.datadoghq.com/enabled: "true"
        # ddtrace from this dd-lib-python-init image tag. Renovate updates it.
        annotations:
          admission.datadoghq.com/python-lib.version: v4.17.2
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1-openvino # pin: the immich chart lags the app and expects the tag set
            pullPolicy: IfNotPresent
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
            DD_IAST_ENABLED: "true"
            DD_APPSEC_SCA_ENABLED: "true"
            DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
      advancedMounts:
        main:
          main:
          - path: /cache
            readOnly: false
