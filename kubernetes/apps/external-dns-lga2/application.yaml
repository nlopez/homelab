# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-lga2
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns-lga2
  sources:
  - repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.24.0
    helm:
      valueFiles:
      - $values/kubernetes/apps/external-dns-lga2/values.yaml
      ignoreMissingValueFiles: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/external-dns-lga2/manifests
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
