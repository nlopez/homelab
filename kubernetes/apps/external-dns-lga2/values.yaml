policy: sync
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/nlopez/external-dns-opnsense-webhook
      tag: feat-record-ttl@sha256:3131c7cff4907e0ce61c3373daa35335389a256a7d44c3ca98ee801df63862e4
    env:
    - name: OPNSENSE_API_SECRET
      valueFrom:
        secretKeyRef:
          name: opnsense-api-dns-webhook-lga2
          key: secret
    - name: OPNSENSE_API_KEY
      valueFrom:
        secretKeyRef:
          name: opnsense-api-dns-webhook-lga2
          key: key
    - name: OPNSENSE_HOST
      value: https://gw.lga2.radoncanyon.com
    - name: LOG_LEVEL
      value: info
sources:
- service
- ingress
- crd
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
registry: noop
domainFilters:
- desertbluffs.com
extraArgs:
- --gateway-name=private
- --min-ttl=60s
logLevel: debug
dnsConfig:
  options:
  - name: ndots
    value: "1"
deploymentAnnotations:
  reloader.stakater.com/auto: "true"
podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: external-dns-lga2
  tags.datadoghq.com/version: v1
