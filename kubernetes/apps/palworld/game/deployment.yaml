# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
  namespace: palworld
  labels:
    app: palworld
    version: v1
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld
    tags.datadoghq.com/version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: palworld
      version: v1
  template:
    metadata:
      labels:
        app: palworld
        version: v1
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: palworld
        tags.datadoghq.com/version: v1
      annotations:
        configmap.reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "palworld-secrets"
        backup.velero.io/backup-volumes: saved
        ad.datadoghq.com/palworld.checks: |
          {
            "palworld": {
              "init_config": {},
              "instances": [
                {
                  "url": "http://%%host%%:8212",
                  "username": "admin",
                  "password": "%%env_PALWORLD_ADMIN_PASSWORD%%",
                  "tags": ["service:palworld"]
                }
              ]
            }
          }
        ad.datadoghq.com/ue4ss-log.logs: |
          [
            {
              "source": "ue4ss",
              "service": "palworld",
              "tags": ["service:palworld"]
            }
          ]
    spec:
      containers:
      - name: palworld
        image: ghcr.io/nlopez/palworld-server-docker@sha256:c9b9a139d4d83b623a8684083843cc812770cea185e69f311d05acfb6cbdeac0
        envFrom:
        - configMapRef:
            name: palworld-config
        env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: adminPassword
        - name: SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: serverPassword
        ports:
        - name: game
          containerPort: 8211
          protocol: UDP
        - name: rest-api
          containerPort: 8212
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: data
          mountPath: /palworld
        - name: saved
          mountPath: /palworld/Pal/Saved
        - name: workshop-mods
          mountPath: /palworld/Mods/workshop-mods.txt
          subPath: workshop-mods.txt
          readOnly: true
        startupProbe:
          exec:
            command: ["bash", "-c", "cd /home/steam/server && . ./helper_functions.sh && PalworldServerPid >/dev/null"]
          failureThreshold: 120
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["bash", "-c", "cd /home/steam/server && . ./helper_functions.sh && PalworldServerPid >/dev/null"]
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["bash", "-c", "cd /home/steam/server && . ./helper_functions.sh && PalworldServerPid >/dev/null"]
          initialDelaySeconds: 120
          periodSeconds: 20
      - name: ue4ss-log
        image: alpine:3.24.3
        command:
        - sh
        - -c
        - |
          log=/palworld/Pal/Binaries/Win64/ue4ss/UE4SS.log
          while [ ! -f "$log" ]; do sleep 5; done
          exec tail -n +1 -f "$log"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /palworld
          readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-nfs
      - name: saved
        persistentVolumeClaim:
          claimName: saved
      - name: workshop-mods
        configMap:
          name: palworld-workshop-mods
