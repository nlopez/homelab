# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-editor
  namespace: palworld
  labels:
    app: palworld-editor
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld-editor
    tags.datadoghq.com/version: 1.38.0 # renovate: image=busybox
spec:
  replicas: 0
  selector:
    matchLabels:
      app: palworld-editor
  template:
    metadata:
      labels:
        app: palworld-editor
        app.kubernetes.io/name: palworld-editor
        app.kubernetes.io/instance: palworld-editor
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: palworld-editor
        tags.datadoghq.com/version: 1.38.0 # renovate: image=busybox
    spec:
      containers:
      - name: editor
        image: busybox:1.38.0
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "1m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: data
          mountPath: /palworld
        - name: saved
          mountPath: /palworld/Pal/Saved
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      securityContext:
        fsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: saved
        persistentVolumeClaim:
          claimName: saved
