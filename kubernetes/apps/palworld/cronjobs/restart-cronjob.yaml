# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: palworld-restart
  namespace: palworld
  labels:
    app: palworld
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld
    tags.datadoghq.com/version: v1
    component: restart
spec:
  schedule: "15 6 * * *"
  timeZone: America/New_York
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: palworld-restart
          containers:
          - name: restart
            image: alpine/k8s:1.37.2
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              NAMESPACE="palworld"
              DEPLOYMENT="palworld"
              CONTAINER_NAME="palworld"

              DISCORD_TIME=$(echo "<t:$(date +%s):f>")

              POD=$(kubectl get pods -n "$NAMESPACE" -l "app=$DEPLOYMENT" \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

              send_discord() {
                local title="$1"
                local color="$2"
                local status="$3"
                local details="$4"

                local json="{
                  \"embeds\": [{
                    \"title\": \"${title}\",
                    \"color\": ${color},
                    \"fields\": [
                      {\"name\": \"Status\", \"value\": \"${status}\", \"inline\": true},
                      {\"name\": \"Time\", \"value\": \"${DISCORD_TIME}\", \"inline\": true},
                      {\"name\": \"Details\", \"value\": \"${details}\", \"inline\": false}
                    ],
                    \"footer\": {\"text\": \"Palworld K8s Restart\", \"icon_url\": \"https://cdn2.steamgriddb.com/icon/9ce60c64ac4510df68537de96631261f/32/256x256.png\"}
                  }]
                }"

                if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
                  curl -sL --data "$json" \
                    --header="Content-Type: application/json" \
                    "${DISCORD_WEBHOOK_URL}" || true
                fi
              }

              if [ -z "$POD" ]; then
                echo "ERROR: No palworld pod found in $NAMESPACE namespace"
                send_discord "Palworld Restart \u2717" 16711680 "ERROR" "Pod not found"
                exit 1
              fi

              echo "Found pod: $POD"

              echo "Triggering save via REST API..."
              SAVE_RESPONSE=$(kubectl exec "$POD" -n "$NAMESPACE" -c "$CONTAINER_NAME" \
                -- rest-cli save 2>&1) || true
              echo "Save response: $SAVE_RESPONSE"

              echo "Waiting for save to complete..."
              sleep 30

              echo "Restarting deployment..."
              kubectl rollout restart deployment "$DEPLOYMENT" -n "$NAMESPACE"

              echo "Waiting for new pod to be ready..."
              kubectl rollout status deployment "$DEPLOYMENT" -n "$NAMESPACE" --timeout=300s

              NEW_POD=$(kubectl get pods -n "$NAMESPACE" -l "app=$DEPLOYMENT" \
                        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              OLD_POD="$POD"

              echo "Restart complete: $OLD_POD -> $NEW_POD"

              send_discord "Palworld Restart \u2713" 5763713 "SUCCESS" \
                "Rolled $OLD_POD -> $NEW_POD"

              echo "Restart job completed successfully"
            env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: palworld-restart-secrets
                  key: url
                  optional: true
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 200m
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palworld-restart
  namespace: palworld
  labels:
    app: palworld
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld
    tags.datadoghq.com/version: v1
    component: restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: palworld
  name: palworld-restart-role
  labels:
    app: palworld
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld
    tags.datadoghq.com/version: v1
    component: restart
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: palworld
  name: palworld-restart-binding
  labels:
    app: palworld
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: palworld
    tags.datadoghq.com/version: v1
    component: restart
subjects:
- kind: ServiceAccount
  name: palworld-restart
  namespace: palworld
roleRef:
  kind: Role
  name: palworld-restart-role
  apiGroup: rbac.authorization.k8s.io
