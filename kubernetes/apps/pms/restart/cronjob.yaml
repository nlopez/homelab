# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
# Restarts Plex nightly once it has no active sessions. If sessions last past MAX_WAIT_SECONDS,
# it skips that night's restart.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pms-restart
spec:
  concurrencyPolicy: Forbid
  timeZone: America/New_York
  schedule: '33 4 * * *'
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 11700
      template:
        metadata:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: pms-restart
            tags.datadoghq.com/version: 1.37.2 # renovate: image=docker.io/alpine/k8s
        spec:
          serviceAccountName: pms-restart
          restartPolicy: Never
          containers:
          - name: kubectl
            image: docker.io/alpine/k8s:1.37.2
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if [ -z "${PLEX_TOKEN:-}" ]; then
                echo "No Plex token in secret pms-sessions; can't check for streams, skipping the restart"
                exit 0
              fi
              count_sessions() {
                local code
                code=$(curl -s -o /tmp/sessions.json -w '%{http_code}' --max-time 10 \
                  -H "X-Plex-Token: ${PLEX_TOKEN}" -H 'Accept: application/json' \
                  http://pms:32400/status/sessions) || true
                case "$code" in
                  000) echo unreachable ;;
                  200) jq '.MediaContainer.size // 0' /tmp/sessions.json ;;
                  *) echo "Plex returned HTTP $code" >&2; return 1 ;;
                esac
              }
              deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
              while :; do
                sessions=$(count_sessions)
                if [ "$sessions" = unreachable ]; then
                  echo "Plex is unreachable, so nothing is streaming; restarting"
                  break
                fi
                if [ "$sessions" -eq 0 ]; then
                  echo "No active Plex sessions; restarting"
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Plex still has $sessions active session(s) after ${MAX_WAIT_SECONDS}s; skipping tonight's restart"
                  exit 0
                fi
                echo "$sessions active Plex session(s); checking again in 60s"
                sleep 60
              done
              kubectl rollout restart deployment/pms
              kubectl rollout status deployment/pms
            env:
            - name: MAX_WAIT_SECONDS
              value: "10800"
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pms-sessions
                  key: token
                  optional: true
