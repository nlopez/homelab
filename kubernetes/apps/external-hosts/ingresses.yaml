# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/ingress-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nas1
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: nas1
    gethomepage.dev/group: Storage
    gethomepage.dev/icon: truenas.png
    gethomepage.dev/description: TrueNAS
    gethomepage.dev/href: https://nas1.lga1.radoncanyon.com/ui/
spec:
  rules:
  - host: nas1.lga1.radoncanyon.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: external-host
            port:
              number: 443
---
