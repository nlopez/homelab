# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litexiv
  annotations:
    secret.reloader.stakater.com/reload: "litexiv"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litexiv
  template:
    metadata:
      labels:
        app: litexiv
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image's static PHP uses musl, which stops walking the search list at
      # the first name that exists. The node's lga1.radoncanyon.com domain
      # answers NOERROR with no records for www.pixiv.net.lga1.radoncanyon.com,
      # so with the default ndots: 5 pixiv hosts never resolve.
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: litexiv
        image: codeberg.org/litexiv/litexiv:v2.3.1
        securityContext:
          allowPrivilegeEscalation: false
          # Workerman writes its pid and status files next to cli.php in /app,
          # and the image has no way to move them.
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
        env:
        - name: LITEXIV_PORT
          value: "8787"
        - name: LITEXIV_TOKEN
          valueFrom:
            secretKeyRef:
              name: litexiv
              key: credential
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 8787
        readinessProbe:
          tcpSocket:
            port: http
