# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
# The private gateway's listeners, reachable from the tailnet without a
# subnet router. Routes opt in with a second parentRef.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailnet
spec:
  gatewayClassName: tailnet
  listeners:
  # One listener for every hostname the gateway serves. Certificates are selected
  # by SNI.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: omni-certificate-rsa
        group: ""
      - kind: Secret
        name: omni-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
  - name: palworld-game-udp
    protocol: UDP
    port: 8211
    allowedRoutes:
      namespaces:
        from: All
  - name: palworld-modded-game-udp
    protocol: UDP
    port: 8311
    allowedRoutes:
      namespaces:
        from: All
  - name: forgejo-ssh
    protocol: TCP
    port: 22
    allowedRoutes:
      namespaces:
        from: All
