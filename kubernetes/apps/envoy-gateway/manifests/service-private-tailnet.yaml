# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/service-v1.json
# Exposes the private gateway's Envoy pods on the tailnet through the heimdall
# ProxyGroup. It is separate from the Service Envoy Gateway creates, which Cilium
# load-balances on the LAN: each LoadBalancer Service needs a single controller
# writing its status.loadBalancer, and loadBalancerClass: tailscale makes this one
# the Tailscale operator's alone.
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway-private-tailnet
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/hostname: envoy-gateway-private
    tailscale.com/proxy-group: heimdall
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: private
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
  - name: https-443
    port: 443
    targetPort: 10443
    protocol: TCP
  - name: https-443-h3
    port: 443
    targetPort: 10443
    protocol: UDP
  - name: udp-8211
    port: 8211
    targetPort: 8211
    protocol: UDP
  - name: udp-8311
    port: 8311
    targetPort: 8311
    protocol: UDP
  - name: tcp-22
    port: 22
    targetPort: 10022
    protocol: TCP
