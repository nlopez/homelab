# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# The tailnet gateway's Service is a Tailscale load balancer, so it gets a
# tailnet address and no DigitalOcean load balancer. Without
# loadBalancerClass, DOKS would create a public one.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: tailnet
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: tailscale
        allocateLoadBalancerNodePorts: false
        annotations:
          tailscale.com/hostname: kernel-gateway
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
