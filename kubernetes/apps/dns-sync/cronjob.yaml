# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-sync
  annotations:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: dns-sync
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 45
      template:
        spec:
          serviceAccountName: dns-sync
          restartPolicy: Never
          containers:
          - name: dns-sync
            image: ghcr.io/nlopez/dns-sync:main
            imagePullPolicy: Always
            env:
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
