# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloud-certificate-ecdsa
spec:
  secretName: cloud-certificate-ecdsa
  isCA: false
  renewBeforePercentage: 30
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
  - '*.desertbluffs.com'
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
