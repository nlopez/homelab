# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
# cloud's only gateway: reachable from the tailnet, never the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailnet
spec:
  gatewayClassName: tailnet
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: cloud-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
  - name: forgejo-ssh
    protocol: TCP
    port: 22
    allowedRoutes:
      namespaces:
        from: All
