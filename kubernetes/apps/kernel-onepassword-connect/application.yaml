# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
# kubernetes/apps/onepassword-connect (same chart, values, and manifests) on the kernel
# DOKS cluster. Keep targetRevision in step with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kernel-onepassword-connect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: kernel
    namespace: 1password
  sources:
  - repoURL: https://1password.github.io/connect-helm-charts
    chart: connect
    targetRevision: 2.4.3
    helm:
      valueFiles:
      - $values/kubernetes/apps/onepassword-connect/values.yaml
      ignoreMissingValueFiles: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/onepassword-connect/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
