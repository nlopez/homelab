# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.18.2
    helm:
      valueFiles:
      - $values/kubernetes/apps/argocd/values.yaml
      ignoreMissingValueFiles: true
      parameters:
      - name: global.podLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/argocd/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  # The Tailscale operator points the egress Service at its proxy by
  # rewriting externalName (manifests/cloud-api-egress.yaml).
  - jsonPointers:
    - /spec/externalName
    kind: Service
    name: cloud-k8s-api
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
