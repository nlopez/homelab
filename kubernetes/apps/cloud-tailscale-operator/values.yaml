operatorConfig:
  # The home operator is tailscale-operator; tailnet device names must differ.
  hostname: tailscale-operator-cloud
  # tag:cloud-operator and tag:cloud are sources in no tailnet grant
  # (tailnet/policy.hujson): the tailnet reaches this cluster, and nothing on
  # it reaches the tailnet or the home networks.
  defaultTags:
  - "tag:cloud-operator"
  logging: info
  image:
    repository: ghcr.io/tailscale/k8s-operator
    pullPolicy: IfNotPresent
proxyConfig:
  defaultTags: "tag:cloud"
  image:
    repository: ghcr.io/tailscale/tailscale
    pullPolicy: IfNotPresent
# The cluster's API is reached over the tailnet at
# tailscale-operator-cloud.macaroni-pirate.ts.net, and the public endpoint is
# closed by the control plane firewall (digitalocean/kubernetes.tf). noauth
# passes the caller's own credentials through, so the home Argo CD keeps using
# its argocd-manager ServiceAccount token and no tailnet grants are needed.
apiServerProxyConfig:
  mode: "noauth"
