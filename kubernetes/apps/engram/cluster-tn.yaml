# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engram-database-tn
spec:
  instances: 1
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: engram-backups
  inheritedMetadata:
    annotations:
      ad.datadoghq.com/postgres.checks: |
        {"postgres":{"init_config":{},"instances":[{"host":"%%host%%","port":5432,"dbname":"engram","username":"datadog","password":"%%env_DD_POSTGRES_PASSWORD%%","ssl":"require","dbm":true,"relations":[{"relation_regex":".*"}]}]}}
  postgresql:
    parameters:
      pg_stat_statements.track: all
      track_activity_query_size: "4096"
  managed:
    roles:
    - name: datadog
      ensure: present
      login: true
      inRoles:
      - pg_monitor
      passwordSecret:
        name: datadog-postgres
  storage:
    size: 5Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: tn-nas1-mtank-iscsi
      resources:
        requests:
          storage: 5Gi
  bootstrap:
    initdb:
      database: engram
      owner: engram
      secret:
        name: onepassword-engram
      import:
        type: microservice
        databases:
        - engram
        source:
          externalCluster: engram-database
  externalClusters:
  - name: engram-database
    connectionParameters:
      host: engram-database-rw.engram.svc.cluster.local
      user: engram
      dbname: engram
    password:
      name: onepassword-engram
      key: password
