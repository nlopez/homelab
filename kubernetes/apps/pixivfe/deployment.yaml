# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixivfe
  annotations:
    secret.reloader.stakater.com/reload: "pixivfe"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixivfe
  template:
    metadata:
      labels:
        app: pixivfe
    spec:
      automountServiceAccountToken: false
      # The Service would otherwise inject PIXIVFE_PORT as a URL.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pixivfe
        image: registry.gitlab.com/pixivfe/pixivfe:v3.1.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
        - name: PIXIVFE_HOST
          value: "0.0.0.0"
        - name: PIXIVFE_TOKEN
          valueFrom:
            secretKeyRef:
              name: pixivfe
              key: credential
        # Without an external media service, pixivfe leaves out the Download
        # menu. media-api-deployment.yaml runs one.
        - name: PIXIVFE_UGOIRAPROXY
          value: https://dupin.desertbluffs.com/media-api
        # Fetch images (i.pximg.net) through the cluster's Cloudflare WARP
        # exit: pages with many images finish sooner than over the home
        # connection's route to Japan. pixiv.net stays direct because
        # Cloudflare answers WARP traffic to it with a bot challenge (403).
        - name: HTTPS_PROXY
          value: http://warp.warp.svc.cluster.local:8888
        - name: NO_PROXY
          value: pixiv.net
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        ports:
        - name: http
          containerPort: 8282
        readinessProbe:
          tcpSocket:
            port: http
