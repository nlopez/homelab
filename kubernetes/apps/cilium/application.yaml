# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
  - repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.5
    helm:
      valueFiles:
      - $values/kubernetes/apps/cilium/values.yaml
      ignoreMissingValueFiles: true
      parameters:
      - name: podLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
      - name: operator.podLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/cilium/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
