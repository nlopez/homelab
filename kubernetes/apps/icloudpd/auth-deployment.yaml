# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icloudpd-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: icloudpd-auth
  template:
    metadata:
      labels:
        app: icloudpd-auth
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: icloudpd-auth
        tags.datadoghq.com/version: v1
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: icloudpd-auth
        image: ghcr.io/nlopez/docker-icloudpd@sha256:74aa2c7fa2dd6c433d59532014190c2af96aae3f5f75437f45a877fe4d335a22
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          [ -f /config/icloudpd-auth.conf ] || cp /config/icloudpd.conf /config/icloudpd-auth.conf
          exec /usr/local/bin/launcher.sh
        env:
        - name: TZ
          value: "America/New_York"
        - name: config_file
          value: /config/icloudpd-auth.conf
        - name: single_pass
          value: "false"
        - name: skip_download
          value: "true"
        - name: skip_check
          value: "true"
        - name: download_notifications
          value: "false"
        - name: telegram_polling
          value: "true"
        - name: wait_for_reauthentication
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /home/user/iCloud
          subPath: icloud
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: media
        persistentVolumeClaim:
          claimName: media
