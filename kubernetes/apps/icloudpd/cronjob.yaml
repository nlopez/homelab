# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloudpd
spec:
  suspend: false
  concurrencyPolicy: Forbid
  timeZone: America/New_York
  schedule: '0 * * * *'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: icloudpd
            tags.datadoghq.com/version: v1
        spec:
          serviceAccountName: icloudpd
          automountServiceAccountToken: false
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: icloudpd-auth
          dnsConfig:
            options:
            - name: ndots
              value: "1"
          initContainers:
          - name: icloudpd
            image: ghcr.io/nlopez/docker-icloudpd:1.0.1384_18-11-2026-icloudpd1.33.0@sha256:74aa2c7fa2dd6c433d59532014190c2af96aae3f5f75437f45a877fe4d335a22
            imagePullPolicy: Always
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              if [ "$(date +%H)" = "03" ]; then mode=full; until_found=""; else mode=incremental; until_found=100; fi
              jitter=$(( $(od -An -N2 -tu2 /dev/urandom) % 900 ))
              echo "icloudpd run: mode=${mode} until_found=${until_found:-unset} jitter=${jitter}s"
              sleep "${jitter}"
              export until_found
              exec /usr/local/bin/launcher.sh
            env:
            - name: TZ
              value: "America/New_York"
            - name: single_pass
              value: "true"
            - name: skip_download
              value: "false"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /home/user/iCloud
              subPath: icloud
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          - name: xmp-changes
            image: ghcr.io/nlopez/docker-icloudpd:1.0.1384_18-11-2026-icloudpd1.33.0@sha256:74aa2c7fa2dd6c433d59532014190c2af96aae3f5f75437f45a877fe4d335a22
            imagePullPolicy: Always
            command: ["/usr/local/bin/xmp-changes.sh"]
            volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /home/user/iCloud
              subPath: icloud
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "500m"
          containers:
          - name: sync-trigger
            image: bitnami/kubectl
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            command: ["kubectl"]
            args: ["create", "job", "--namespace=immich", "--from=cronjob/immich-sidecar-sync", "immich-sidecar-sync-$(POD_NAME)"]
            volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "128Mi"
          volumes:
          - name: kube-api-access
            projected:
              defaultMode: 292
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
              - downwardAPI:
                  items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
          - name: config
            persistentVolumeClaim:
              claimName: config
          - name: media
            persistentVolumeClaim:
              claimName: media
