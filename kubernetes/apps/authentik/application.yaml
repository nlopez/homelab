# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  sources:
  - repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.8.6
    helm:
      valueFiles:
      - $values/kubernetes/apps/authentik/values.yaml
      ignoreMissingValueFiles: true
      # The chart version is the authentik version; Argo CD substitutes it here.
      parameters:
      - name: global.additionalLabels.tags\.datadoghq\.com/version
        value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        forceString: true
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/nlopez/homelab.git
    targetRevision: main
    path: kubernetes/apps/authentik/manifests
  ignoreDifferences:
  - jsonPointers:
    - /spec/volumeName
    kind: PersistentVolumeClaim
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
