# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-private
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: authentik
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: authentik.png
    gethomepage.dev/description: Identity provider
    gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - arsox.desertbluffs.com
  rules:
  - backendRefs:
    - name: authentik-server
      port: 80
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
