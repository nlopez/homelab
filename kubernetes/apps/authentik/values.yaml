global:
  # Datadog unified service tags. The chart puts additionalLabels on every
  # object it renders, including both Deployments and their pod templates.
  # tags.datadoghq.com/version is the chart version, set in application.yaml.
  additionalLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: authentik
  podLabels:
    admission.datadoghq.com/enabled: "true"
  # The Datadog admission controller injects ddtrace from this init image tag
  # (the latest 4.x release) for APM and Code Security.
  podAnnotations:
    admission.datadoghq.com/python-lib.version: v4
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  env:
  - name: AUTHENTIK_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: onepassword-authentik-secret-key
        key: password
  - name: AUTHENTIK_POSTGRESQL__PASSWORD
    valueFrom:
      secretKeyRef:
        name: onepassword-authentik-database
        key: password
  - name: AUTHENTIK_POSTGRESQL__SSLMODE
    value: require
  - name: AUTHENTIK_EMAIL__USERNAME
    valueFrom:
      secretKeyRef:
        name: onepassword-authentik-smtp
        key: username
  - name: AUTHENTIK_EMAIL__PASSWORD
    valueFrom:
      secretKeyRef:
        name: onepassword-authentik-smtp
        key: password
  - name: DD_IAST_ENABLED
    value: "true"
  - name: DD_APPSEC_SCA_ENABLED
    value: "true"
  # Client spans (Postgres, HTTP) keep service:authentik; Datadog identifies
  # the dependency from peer.* tags instead of a separate service.
  - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
    value: "true"
authentik:
  postgresql:
    host: authentik-database-tn-rw.authentik.svc.cluster.local
    name: authentik
    user: authentik
  email:
    host: email-smtp.us-east-1.amazonaws.com
    port: 587
    use_tls: true
    from: authentik <authentik@desertbluffs.com>
  error_reporting:
    enabled: false
# Serves the Desert Bluffs brand assets (branding/ directory, rendered into
# manifests/branding.yaml) from /static/dist/assets/desert-bluffs/, which
# the authentik_brand resource in authentik/brand.tf points at. ConfigMap
# keys cannot contain '/', so each key is mounted by name via subPath.
server:
  volumes:
  - name: branding
    configMap:
      name: authentik-branding
  volumeMounts:
  - name: branding
    subPath: logo-light.svg
    mountPath: /web/dist/assets/desert-bluffs/logo-light.svg
    readOnly: true
  - name: branding
    subPath: logo-dark.svg
    mountPath: /web/dist/assets/desert-bluffs/logo-dark.svg
    readOnly: true
  - name: branding
    subPath: logo-light.png
    mountPath: /web/dist/assets/desert-bluffs/logo-light.png
    readOnly: true
  - name: branding
    subPath: logo-dark.png
    mountPath: /web/dist/assets/desert-bluffs/logo-dark.png
    readOnly: true
  - name: branding
    subPath: favicon.svg
    mountPath: /web/dist/assets/desert-bluffs/favicon.svg
    readOnly: true
  - name: branding
    subPath: favicon.png
    mountPath: /web/dist/assets/desert-bluffs/favicon.png
    readOnly: true
  - name: branding
    subPath: background.png
    mountPath: /web/dist/assets/desert-bluffs/background.png
    readOnly: true
  # The injected ddtrace and Code Security add about 300Mi to the server.
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 1536Mi
worker:
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  # `ak healthcheck` takes 4-6s with ddtrace injected; the chart's 3s timeout
  # fails the worker's startup probe.
  startupProbe:
    timeoutSeconds: 10
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 10
