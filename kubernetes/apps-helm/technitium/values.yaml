env:
  TZ: America/New_York
service:
  main:
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
    - IPv4
    - IPv6
    ports:
      http:
        port: 5380
    externalTrafficPolicy: Local
persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: technitium-config
    mountPath: /etc/dns
