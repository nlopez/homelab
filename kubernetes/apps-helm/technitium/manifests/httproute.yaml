# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium-private
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Technitium (k8s)
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: technitium.png
    gethomepage.dev/description: Cluster DNS
    gethomepage.dev/pod-selector: app.kubernetes.io/name=technitium-dnsserver
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - dns.desertbluffs.com
  rules:
  - backendRefs:
    - name: technitium-technitium-dnsserver
      port: 5380
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      backendRequest: 0s
