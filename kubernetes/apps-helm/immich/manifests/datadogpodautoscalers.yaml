apiVersion: datadoghq.com/v1alpha2
kind: DatadogPodAutoscaler
metadata:
  name: immich-server
  namespace: immich
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-server
  owner: Local
  applyPolicy:
    mode: Apply
    scaleUp:
      strategy: Disabled
    scaleDown:
      strategy: Disabled
    update:
      strategy: Auto
  objectives:
  - type: PodResource
    podResource:
      name: cpu
      value:
        type: Utilization
        utilization: 80
  - type: PodResource
    podResource:
      name: memory
      value:
        type: Utilization
        utilization: 80
---
