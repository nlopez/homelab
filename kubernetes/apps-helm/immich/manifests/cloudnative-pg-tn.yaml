# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database-tn
spec:
  instances: 1
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: immich-backups
  inheritedMetadata:
    annotations:
      ad.datadoghq.com/postgres.checks: |
        {"postgres":{"init_config":{},"instances":[{"host":"%%host%%","port":5432,"dbname":"immich","username":"datadog","password":"%%env_DD_POSTGRES_PASSWORD%%","ssl":"require","dbm":true,"relations":[{"relation_regex":".*"}]}]}}
      backup.velero.io/backup-volumes: pgdata
  postgresql:
    parameters:
      pg_stat_statements.track: all
      track_activity_query_size: "4096"
    shared_preload_libraries:
    - 'vchord.so'
  managed:
    roles:
    - name: datadog
      ensure: present
      login: true
      inRoles:
      - pg_monitor
      passwordSecret:
        name: datadog-postgres
  storage:
    size: 20Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: tn-nas1-mtank-iscsi
      resources:
        requests:
          storage: 20Gi
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.15-1.1.1
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: onepassword-immich-database
      import:
        type: microservice
        databases:
        - immich
        source:
          externalCluster: immich-database
  externalClusters:
  - name: immich-database
    connectionParameters:
      host: immich-database-rw.immich.svc.cluster.local
      user: immich
      dbname: immich
    password:
      name: onepassword-immich-database
      key: password
