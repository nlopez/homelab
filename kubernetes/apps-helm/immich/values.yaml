global:
  propagateGlobalMetadataToPods: true
  labels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: immich
    tags.datadoghq.com/version: v1
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.4.1
          pullPolicy: IfNotPresent
        env:
          DB_HOSTNAME: immich-database-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_PASSWORD:
            secretKeyRef:
              name: onepassword-immich-database
              key: password
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: immich-valkey.immich.svc.cluster.local
          REDIS_PORT: "6379"
immich:
  configuration: {}
  persistence:
    library:
      existingClaim: immich-library-nfs
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.2-alpine
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: tn-nas1-mtank-iscsi
server:
  enabled: true
  controllers:
    main:
      replicas: 2
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.4.1
            pullPolicy: IfNotPresent
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          env:
            IMMICH_FFMPEG_HWACCEL: qsv
  persistence:
    icloud:
      enabled: true
      existingClaim: immich-icloud-nfs
      advancedMounts:
        main:
          main:
          - path: /icloud
            readOnly: true
machine-learning:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1-openvino
            pullPolicy: IfNotPresent
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
      advancedMounts:
        main:
          main:
          - path: /cache
            readOnly: false
