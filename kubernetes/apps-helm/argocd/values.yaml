global:
  domain: flopie.desertbluffs.com
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: argocd
    tags.datadoghq.com/version: v1
configs:
  secret:
    githubSecret: $argocd-webhook-github:password
  # The authentik side lives in authentik/argocd.tf. The local admin account
  # stays enabled for when authentik is down.
  rbac:
    # authentik group names from the OIDC groups claim.
    policy.csv: |
      g, admin, role:admin
      g, users, role:readonly
  cm:
    oidc.config: |
      name: authentik
      issuer: https://arsox.desertbluffs.com/application/o/argocd/
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email", "groups"]
    resource.exclusions: |
      - apiGroups:
          - velero.io
        kinds:
          - Backup
          - Restore
        clusters:
          - "*"
      - apiGroups:
          - postgresql.cnpg.io
        kinds:
          - ClusterRestore
          - ClusterBackup
        clusters:
          - "*"
      - apiGroups:
          - batch
        kinds:
          - Job
        clusters:
          - "kube-system.*"
    resource.customizations.ignoreDifferences.cert-manager.io_Certificate: |
      jsonPointers:
      - /status
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    resource.customizations.ignoreDifferences.apps_DaemonSet: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    resource.customizations.ignoreDifferences.snapshot.storage.k8s.io_VolumeSnapshotContent: |
      jsonPointers:
      - /spec/volumeSnapshotRef/uid
    # The API server fills these list-item defaults in, and client-side diff
    # cannot see CRD defaults inside lists (argoproj/argo-cd#28724).
    resource.customizations.ignoreDifferences.postgresql.cnpg.io_Cluster: |
      jqPathExpressions:
      - .spec.managed.roles[]?.connectionLimit
      - .spec.managed.roles[]?.inherit
      - .spec.plugins[]?.enabled
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    resource.customizations.health.argoproj.io_ApplicationSet: |
      hs = {}
      hs.status = "Healthy"
      hs.message = ""
      return hs
    # Same as the built-in Ingress check, except the external-hosts placeholders
    # exist only to carry gethomepage.dev annotations, so no controller will ever
    # write a load balancer into their status.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.loadBalancer ~= nil then
        lbs = obj.status.loadBalancer.ingress
        if lbs ~= nil and #lbs > 0 then
          hs.status = "Healthy"
        elseif obj.metadata ~= nil and obj.metadata.annotations ~= nil and obj.metadata.annotations["gethomepage.dev/external"] == "true" then
          hs.status = "Healthy"
        end
      end
      return hs
  params:
    server.insecure: true
server:
  ingress:
    enabled: false
  httproute:
    enabled: false
  service:
    servicePortHttpsAppProtocol: kubernetes.io/h2c
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: argocd-webhook-github
  podAnnotations:
    ad.datadoghq.com/server.checks: |
      {
        "argocd": {
          "init_config": {},
          "instances": [
            {
              "api_server_endpoint": "http://%%host%%:8083/metrics"
            }
          ]
        }
      }
repoServer:
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  podAnnotations:
    ad.datadoghq.com/repo-server.checks: |
      {
        "argocd": {
          "init_config": {},
          "instances": [
            {
              "repo_server_endpoint": "http://%%host%%:8084/metrics"
            }
          ]
        }
      }
controller:
  podAnnotations:
    ad.datadoghq.com/application-controller.checks: |
      {
        "argocd": {
          "init_config": {},
          "instances": [
            {
              "app_controller_endpoint": "http://%%host%%:8082/metrics"
            }
          ]
        }
      }
notifications:
  podAnnotations:
    ad.datadoghq.com/notifications-controller.checks: |
      {
        "argocd": {
          "init_config": {},
          "instances": [
            {
              "notifications_controller_endpoint": "http://%%host%%:9001/metrics"
            }
          ]
        }
      }
applicationSet:
  extraArgs:
  - --enable-progressive-syncs
  podAnnotations:
    ad.datadoghq.com/applicationset-controller.checks: |-
      {
        "argocd": {
          "init_config": {},
          "instances": [
            {
              "appset_controller_endpoint": "http://%%host%%:8080/metrics"
            }
          ]
        }
      }
