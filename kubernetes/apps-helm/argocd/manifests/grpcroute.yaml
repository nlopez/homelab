# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/grpcroute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd-server-private
  namespace: argocd
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - argocd.desertbluffs.com
  - flopie.desertbluffs.com
  rules:
  - matches:
    - headers:
      - name: content-type
        type: RegularExpression
        value: "^application/grpc.*$"
    backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 443
      weight: 1
