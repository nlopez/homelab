image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.24.0
policy: sync
provider:
  name: cloudflare
env:
- name: CF_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: cloudflare-api-token
      key: api-token
- name: EXTERNAL_DNS_TXT_ENCRYPT_AES_KEY
  valueFrom:
    secretKeyRef:
      name: txt-encrypt-aes-key
      key: aes_key
- name: EXTERNAL_DNS_TXT_ENCRYPT_ENABLED
  value: "true"
sources:
- service
- ingress
- crd
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
extraArgs:
# Proxied (orange-cloud) is the default for every record; a route opts out
# with external-dns.kubernetes.io/cloudflare-proxied: "false".
- --cloudflare-proxied
- --gateway-name=internet
- --domain-filter=desertbluffs.com
- --domain-filter=kamotimestamps.com
# Only public addresses belong in Cloudflare. The internet gateway Service also has a
# private IPv4 address, and only its public IPv6 address should be published for lga1.
- --exclude-target-net=10.0.0.0/8
- --exclude-target-net=fd00::/8
logLevel: debug
podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: external-dns
  tags.datadoghq.com/version: v1
