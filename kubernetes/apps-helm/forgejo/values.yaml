image:
  tag: 15.0.12
  rootless: true
strategy:
  type: Recreate
deployment:
  labels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: forgejo
    tags.datadoghq.com/version: v1
service:
  ssh:
    type: LoadBalancer
    port: 22
    annotations:
      lbipam.cilium.io/ips: "10.43.64.22"
      external-dns.alpha.kubernetes.io/hostname: forgejo-ssh.radoncanyon.com
persistence:
  enabled: true
  create: true
  claimName: forgejo-data
  size: 20Gi
  storageClass: tn-nas1-mtank-iscsi
  annotations:
    helm.sh/resource-policy: keep
gitea:
  admin:
    existingSecret: onepassword-forgejo-admin
    email: forgejo-admin@desertbluffs.com
    passwordMode: initialOnlyNoReset
  additionalConfigFromEnvs:
  - name: FORGEJO__DATABASE__PASSWD
    valueFrom:
      secretKeyRef:
        name: onepassword-forgejo-database
        key: password
  config:
    APP_NAME: Forgejo
    server:
      DOMAIN: forgejo.desertbluffs.com
      ROOT_URL: https://forgejo.desertbluffs.com/
      SSH_DOMAIN: forgejo-ssh.radoncanyon.com
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222
    database:
      DB_TYPE: postgres
      HOST: forgejo-database-tn-rw.forgejo.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: require
    cache:
      ADAPTER: memory
    session:
      PROVIDER: db
    queue:
      TYPE: level
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: https://code.forgejo.org
    repository:
      DEFAULT_BRANCH: main
extraContainers:
- name: register-runner
  image: code.forgejo.org/forgejo/forgejo:15.0.12-rootless
  command:
  - /bin/sh
  - -c
  - |-
    until forgejo forgejo-cli actions register --name k8s-dind --secret "${RUNNER_SECRET}"; do
      sleep 10
    done
    exec sleep infinity
  env:
  - name: GITEA_APP_INI
    value: /data/gitea/conf/app.ini
  - name: GITEA_CUSTOM
    value: /data/gitea
  - name: GITEA_WORK_DIR
    value: /data
  - name: GITEA_TEMP
    value: /tmp/gitea
  - name: HOME
    value: /data/gitea/git
  - name: RUNNER_SECRET
    valueFrom:
      secretKeyRef:
        name: onepassword-forgejo-runner
        key: token
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
  volumeMounts:
  - name: data
    mountPath: /data
  - name: temp
    mountPath: /tmp
