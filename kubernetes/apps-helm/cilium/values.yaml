updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
k8sServiceHost: "192.168.222.245"
k8sServicePort: "8443"
kubeProxyReplacement: true
installNoConntrackIptablesRules: true
bpfClockProbe: true
bgpControlPlane:
  enabled: true
ipam:
  mode: "cluster-pool"
  operator:
    clusterPoolIPv4PodCIDRList: ["10.43.16.0/20"]
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv6PodCIDRList: ["2600:4041:5b21:6b10::/64"]
    clusterPoolIPv6MaskSize: 112
routingMode: "native"
autoDirectNodeRoutes: true
directRoutingSkipUnreachable: true
ipv4:
  enabled: true
ipv6:
  enabled: true
ipv4NativeRoutingCIDR: "10.43.0.0/16"
ipv6NativeRoutingCIDR: "2600:4041:5b21:6b00::/56"
# Pods keep their global address on egress; the gateway routes the pod /64 back over BGP.
enableIPv6Masquerade: false
localRedirectPolicies:
  enabled: true
bpf:
  datapathMode: netkit
  masquerade: true
  lbExternalClusterIP: true
  hostLegacyRouting: false
  tproxy: false
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.08
  events:
    monitorInterval: "10s"
    default:
      rateLimit: 10000
      burstLimit: 50000
  disableExternalIPMitigation: true
loadBalancer:
  mode: hybrid
socketLB:
  enabled: true
bandwidthManager:
  enabled: true
  bbr: true
vlanBypass: 0
hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: cronJob
  ui:
    enabled: true
  relay:
    enabled: true
  eventQueueSize: 32768
  export:
    static:
      enabled: true
      filePath: /var/run/cilium/hubble/events.log
      fileMaxSizeMb: 200
      fileMaxBackups: 10
      fileCompress: true
      fieldMask:
      - time
      - verdict
      - traffic_direction
      - source.namespace
      - source.pod_name
      - source.labels
      - destination.namespace
      - destination.pod_name
      - destination.labels
      - destination_names
      - IP
      - l4
      allowList:
      - '{"reply":[false],"traffic_direction":["EGRESS"],"protocol":["TCP"],"tcp_flags":[{"SYN":true}]}'
      - '{"reply":[false],"traffic_direction":["EGRESS"],"protocol":["UDP"]}'
      denyList:
      - '{"source_label":["reserved:host","reserved:world","reserved:remote-node"]}'
policyAuditMode: true
MTU: 1500
endpointRoutes:
  enabled: true
prometheus:
  enabled: true
operator:
  prometheus:
    enabled: true
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: cilium-operator
    tags.datadoghq.com/version: v1
  podAnnotations:
    ad.datadoghq.com/cilium-operator.checks: |
      {
        "cilium": {
          "init_config": {},
          "instances": [
            {
              "operator_endpoint": "http://%%host%%:9963/metrics",
              "use_openmetrics": "true"
            }
          ]
        }
      }
podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: cilium
  tags.datadoghq.com/version: v1
podAnnotations:
  ad.datadoghq.com/cilium-agent.checks: |-
    {
      "cilium": {
        "init_config": {},
        "instances": [
          {
            "agent_endpoint": "http://%%host%%:9962/metrics",
            "use_openmetrics": "true"
          }
        ]
      }
    }
