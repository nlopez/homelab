# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-synthetics-private-location
  labels:
    app: datadog-synthetics-private-location
    version: v1
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: datadog-synthetics-private-location
    tags.datadoghq.com/version: v1
  annotations:
    secret.reloader.stakater.com/reload: "datadog-keys"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datadog-synthetics-private-location
  template:
    metadata:
      labels:
        app: datadog-synthetics-private-location
        version: v1
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: datadog-synthetics-private-location
        tags.datadoghq.com/version: v1
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: datadog/synthetics-private-location-worker:1.75.0
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: worker-config
          mountPath: /etc/datadog/synthetics-check-runner.json
          subPath: synthetics-check-runner-json
          readOnly: true
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: worker-config
        secret:
          secretName: datadog-keys
          items:
          - key: synthetics-check-runner-json
            path: synthetics-check-runner-json
