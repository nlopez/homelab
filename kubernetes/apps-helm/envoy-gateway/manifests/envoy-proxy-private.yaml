# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "10.43.64.10"
          tailscale.com/expose: "true"
          tailscale.com/hostname: envoy-gateway-private
          tailscale.com/proxy-group: heimdall
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        pod:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: envoy-proxy-private
            tags.datadoghq.com/version: v1
          annotations:
            ad.datadoghq.com/envoy.checks: |-
              {
                "envoy": {
                  "init_config": {},
                  "instances": [
                    {
                      "openmetrics_endpoint": "http://%%host%%:19001/stats/prometheus"
                    }
                  ]
                }
              }
