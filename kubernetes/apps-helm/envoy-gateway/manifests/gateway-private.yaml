# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
spec:
  gatewayClassName: private
  addresses:
  - type: IPAddress
    value: 10.43.64.10
  - type: IPAddress
    value: fd54:571b:560a:4364::10
  listeners:
  # One listener for every hostname the gateway serves. Envoy Gateway builds one
  # filter chain per Gateway listener, so a single listener keeps the HTTP/2
  # websocket patch at a fixed /filter_chains/0. Certificates are selected by SNI.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: omni-certificate-rsa
        group: ""
      - kind: Secret
        name: omni-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
  - name: palworld-game-udp
    protocol: UDP
    port: 8211
    allowedRoutes:
      namespaces:
        from: All
  - name: palworld-modded-game-udp
    protocol: UDP
    port: 8311
    allowedRoutes:
      namespaces:
        from: All
  - name: forgejo-ssh
    protocol: TCP
    port: 22
    allowedRoutes:
      namespaces:
        from: All
