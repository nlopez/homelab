# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internet
spec:
  gatewayClassName: internet
  addresses:
  - type: IPAddress
    value: 10.43.64.20
  - type: IPAddress
    value: 2600:4041:5b21:6b64::20
  listeners:
  # One listener for every hostname the gateway serves. Envoy Gateway builds one
  # filter chain per Gateway listener, so a single listener keeps the HTTP/2
  # websocket patch at a fixed /filter_chains/0. Certificates are selected by SNI.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: omni-certificate-rsa
        group: ""
      - kind: Secret
        name: omni-certificate-ecdsa
        group: ""
      - kind: Secret
        name: kamotimestamps-certificate-rsa
        group: ""
      - kind: Secret
        name: kamotimestamps-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
