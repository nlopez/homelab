# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tls-settings-private
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: private
  tls:
    session:
      resumption:
        stateless: {}
        stateful: {}
    ecdhCurves:
    - X25519MLKEM768
    - X25519
    - P-256
    alpnProtocols:
    - h2
    - http/1.1
  http3: {}
  headers:
    lateResponseHeaders:
      set:
      - name: strict-transport-security
        value: max-age=63072000; includeSubDomains; preload
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tls-settings-internet
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
  tls:
    session:
      resumption:
        stateless: {}
        stateful: {}
    ecdhCurves:
    - X25519MLKEM768
    - X25519
    - P-256
    alpnProtocols:
    - h2
    - http/1.1
    # Most internet hostnames are DNS-only, so clients connect directly without
    # a certificate. Proxied routes check for Cloudflare's Authenticated Origin
    # Pulls certificate themselves (see the timekeeper EnvoyExtensionPolicy).
    clientValidation:
      mode: VerifyIfGiven
      caCertificateRefs:
      - kind: ConfigMap
        name: timekeeper-aop-ca
        group: ""
  headers:
    lateResponseHeaders:
      set:
      - name: strict-transport-security
        value: max-age=63072000; includeSubDomains; preload
