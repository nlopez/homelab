# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/envoypatchpolicy_v1alpha1.json
# Lets clients run WebSockets over HTTP/2 (RFC 8441 extended CONNECT).
# Envoy Gateway merges every HTTPS listener on port 443 into one Envoy listener
# named after the first Gateway listener, with one filter chain per Gateway
# listener in spec order. Each patch adds allow_connect to one chain's HTTP
# connection manager and keeps the http2_protocol_options Envoy Gateway sets.
# Adding, removing, or reordering a 443 listener on a Gateway changes the chain
# indexes below.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: h2-websockets-internet
  namespace: envoy-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
  type: JSONPatch
  jsonPatches:
  # wildcard-desertbluffs-com-https
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "envoy-gateway-system/internet/wildcard-desertbluffs-com-https"
    operation:
      op: add
      path: "/filter_chains/0/filters/0/typed_config/http2_protocol_options/allow_connect"
      value: true
  # kamotimestamps-com-https
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "envoy-gateway-system/internet/wildcard-desertbluffs-com-https"
    operation:
      op: add
      path: "/filter_chains/1/filters/0/typed_config/http2_protocol_options/allow_connect"
      value: true
  # apex-desertbluffs-com-https
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "envoy-gateway-system/internet/wildcard-desertbluffs-com-https"
    operation:
      op: add
      path: "/filter_chains/2/filters/0/typed_config/http2_protocol_options/allow_connect"
      value: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/envoypatchpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: h2-websockets-private
  namespace: envoy-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: private
  type: JSONPatch
  jsonPatches:
  # wildcard-desertbluffs-com-https
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "envoy-gateway-system/private/wildcard-desertbluffs-com-https"
    operation:
      op: add
      path: "/filter_chains/0/filters/0/typed_config/http2_protocol_options/allow_connect"
      value: true
  # apex-desertbluffs-com-https
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "envoy-gateway-system/private/wildcard-desertbluffs-com-https"
    operation:
      op: add
      path: "/filter_chains/1/filters/0/typed_config/http2_protocol_options/allow_connect"
      value: true
