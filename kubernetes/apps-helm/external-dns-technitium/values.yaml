image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.24.0
policy: sync
provider:
  name: pdns
env:
- name: EXTERNAL_DNS_PDNS_API_KEY
  valueFrom:
    secretKeyRef:
      name: pdns-api-key
      key: password
sources:
- service
- ingress
- crd
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
domainFilters:
- desertbluffs.com
extraArgs:
- --gateway-name=private
- --pdns-server=http://pdns.pdns.svc.cluster.local:8081
- --min-ttl=60s
- --txt-owner-id=technitium
logLevel: debug
dnsConfig:
  options:
  - name: ndots
    value: "1"
podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: external-dns-technitium
  tags.datadoghq.com/version: v1
