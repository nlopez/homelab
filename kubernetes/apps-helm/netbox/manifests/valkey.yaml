# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: netbox-valkey
  template:
    metadata:
      labels:
        app: netbox-valkey
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: netbox
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: valkey
        image: docker.io/valkey/valkey:9.2-alpine
        # Tasks and cache only; NetBox keeps its data in Postgres.
        command: ["sh", "-c", 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --save ""']
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: netbox-valkey
              key: password
        ports:
        - name: valkey
          containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: valkey
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: valkey
          initialDelaySeconds: 10
          periodSeconds: 10
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
spec:
  selector:
    app: netbox-valkey
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
