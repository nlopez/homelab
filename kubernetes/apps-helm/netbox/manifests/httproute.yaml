# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbox-private
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: NetBox
    gethomepage.dev/group: Network
    gethomepage.dev/icon: netbox.png
    gethomepage.dev/description: IPAM and DCIM
    gethomepage.dev/pod-selector: app.kubernetes.io/name=netbox,app.kubernetes.io/component=netbox
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - kikit.desertbluffs.com
  rules:
  - backendRefs:
    - name: netbox
      port: 80
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
