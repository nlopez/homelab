# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/onepassword.com/onepassworditem_v1.json
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cnpg-backups-spaces
  namespace: netbox
spec:
  itemPath: "vaults/evjh25ux2mnoufaut6qhvm2pdi/items/uvfekeu7grfa7wzz2pe33rticq"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: netbox-backups
  namespace: netbox
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://homelab-cnpg-backups-1sslgx/netbox/
    endpointURL: https://sfo3.digitaloceanspaces.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backups-spaces
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backups-spaces
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: netbox-database-tn-daily
  namespace: netbox
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: netbox-database-tn
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
