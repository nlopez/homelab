---
technitium_version: "15.6.2"
technitium_checksum: sha256:51f2d4ebaf156a85035e820afde5e1d428f1920a37d7f0c65203fb1766917e08

technitium_user: dns-server
technitium_install_dir: /opt/technitium/dns
technitium_config_dir: /etc/dns
technitium_log_dir: /var/log/technitium/dns
technitium_log_max_days: 3

technitium_runtime_directory: technitium
technitium_web_socket: "/run/{{ technitium_runtime_directory }}/web.sock"
technitium_web_socket_group: www-data
technitium_web_local_addresses:
  - 127.0.0.1
  - "::1"
technitium_api_url: http://127.0.0.1:5380

technitium_api_token: >-
  {{ lookup('ansible.builtin.pipe',
  'op read op://evjh25ux2mnoufaut6qhvm2pdi/' ~ technitium_api_token_item_id ~ '/credential --account my.1password.com') }}

technitium_forwarders: []

# Zones for tailnet clients are forwarder zones pointed at the site gateway,
# with the tailnet addresses below as local records.
technitium_tailnet_forwarder: "{{ datadog_gateway_address }}:53"
technitium_tailnet_records: []
technitium_tailnet_record_ttl: 300
