---
- name: Install NFS utils
  ansible.builtin.package:
    name: '{{ nfs_utils }}'
    state: present

- name: Ensure mount points exist
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    mode: "0755"
  loop: "{{ nfs_mounts | default([]) }}"

- name: Start and enable rpcbind
  ansible.builtin.service:
    name: rpcbind
    enabled: true
    state: started
