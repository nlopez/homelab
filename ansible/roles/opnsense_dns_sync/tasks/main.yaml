---
# The retired SSH-based DNS sync receiver and its split-horizon template
# experiments, removed now that the external-dns OPNsense webhook writes the
# private records as Unbound host overrides.
- name: Remove the retired dns-sync receiver and templates
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/dns-sync-apply
    - /usr/local/etc/sudoers.d/dns-sync
    - /var/unbound/etc/dns-sync.conf
    - /var/unbound/etc/homelab.conf
    - "{{ opnsense_dns_sync_template_dir }}/homelab.conf"
    - /usr/local/etc/unbound.opnsense.d/homelab.conf

- name: Unregister the split-horizon template from +TARGETS
  ansible.builtin.lineinfile:
    path: "{{ opnsense_dns_sync_template_dir }}/+TARGETS"
    line: homelab.conf:/var/unbound/etc/homelab.conf
    state: absent
  notify: render unbound templates

- name: Remove the retired dns-sync account
  ansible.builtin.user:
    name: dns-sync
    state: absent

- name: Remove the retired dns-sync group
  ansible.builtin.group:
    name: dns-sync
    state: absent
