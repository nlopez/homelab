---
- name: Set Kubernetes sysctls
  ansible.builtin.template:
    src: 70-k8s.conf.j2
    dest: /etc/sysctl.d/70-k8s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload sysctl
  tags: kubernetes_sysctls

- name: Remove stale Docker-era sysctl file
  ansible.builtin.file:
    path: /etc/sysctl.d/60-docker.conf
    state: absent
  notify: Reload sysctl

- name: Remove legacy Kubernetes apt repo and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kubernetes.list
    - /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Install Kubernetes apt repo
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/Release.key"
    state: present
  register: kubernetes_apt_repo

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: kubernetes_apt_repo is changed # noqa: no-handler

- name: Pin versions on Kubernetes packages
  ansible.builtin.template:
    src: kubernetes_apt_pins
    dest: /etc/apt/preferences.d/kubernetes
    owner: root
    group: root
    mode: '0644'

- name: Install Kubernetes packages
  ansible.builtin.package:
    name: "{{ kubernetes_packages }}"
    force: true
    state: present

- name: Install supporting Kubernetes packages
  ansible.builtin.package:
    name: "{{ kubernetes_other_packages }}"
    state: present

- name: Configure kubelet for containerd
  ansible.builtin.template:
    src: etc_default_kubelet
    dest: /etc/default/kubelet
    mode: '0640'
  notify: Restart kubelet
  tags: kubelet_args

- name: Start and enable Kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
    state: started

- name: Configure haproxy in front of kube-apiserver
  ansible.builtin.include_tasks: haproxy.yaml

- name: Configure keepalived vrrp for stacked Kubernetes masters
  ansible.builtin.include_tasks: keepalived.yaml
