---
- name: Apply common role to all hosts
  hosts: "all:!gateways"
  pre_tasks:
    - name: Group by operating system
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"
      changed_when: false
  roles:
    - common
    - networkd

- name: Configure Kubernetes hosts
  hosts: kubernetes
  roles:
    - role: netplan
      tags: netplan
    - resolved
    - iscsi
    - nfs
    - containerd
    - kubernetes
    - role: tailscale
      tags: tailscale
    - sshd
    - nic_offload
    - role: nm_disabled_connections
      tags: nm_disabled_connections
    - role: unattended_upgrades
      tags: unattended_upgrades

- name: Configure infra hosts
  hosts: infra
  roles:
    - role: netplan
      tags: netplan
    - armbian_ramlog
    - role: tailscale
      tags: tailscale
    - role: unattended_upgrades
      tags: unattended_upgrades
    - role: netflow9_fixup
      tags: datadog
    - role: datadog.dd.agent
      tags: datadog
